cas.configuration.name=CAS serveru (Automatic Translation)
enabled-help=Nastavte na "pravda" aby ste povolili Google autentizáciu.
import-from-ldap-help=Nastavte na true ak sa majú automaticky importovať používatelia z LDAP v prípade, že ešte neexistujú na portáli.
logout-on-session-expiration-help=Nastavte na true ak chcete aby bol používateľ odhlásený z CAS keď mu vyprší relácia.
server-name-help=Nastavenie názvu servera umožňí odkazovnie do hĺbky.