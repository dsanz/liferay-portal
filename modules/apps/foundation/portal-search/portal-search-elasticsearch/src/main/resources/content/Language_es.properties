additional-configurations-help=Ajuste las configuraciones personalizadas para el Elasticsearch incrustado en formato YML (elasticsearch.yml)
additional-index-configurations-help=Ajuste la configuraciones personalizada para el índice Liferay, en formato JSOn o YML (API creador de índices Elasticsearch).
additional-type-mappings-help=Ajuste los mapeos personalizados para el LiferayDocumentType, en formato JSON (API mapeador Elasticsearch)
bootstrap-mlockall-help=Si esto se comprueba, el espacio de dirección del proceso está bloqueado en memoria RAM, evitando que cualquier memoria Elasticsearch ser intercambiados hacia fuera. (Automatic Translation)
client-transport-ignore-cluster-name-help=Si esto se comprueba, se omite la validación de nombre de clúster de nodos conectados. (Automatic Translation)
client-transport-nodes-sampler-interval-help=Indica el nodo de cliente en la frecuencia de muestra/ping los nodos mencionados y conectado. (Automatic Translation)
client-transport-sniff-help=Si esto se comprueba, rastreo de grupo está habilitada para descubrir dinámicamente los nodos disponibles del clúster. (Automatic Translation)
cluster-name-help=El nombre del grupo a. El nombre debe coincidir con el cluster remoto al modo de operación se establece a distancia. (Automatic Translation)
discovery-zen-ping-unicast-hosts-port-help=Intervalo de puertos para utilizar cuando el valor de discovery.zen.ping.unicast.hosts. Múltiples nodos de Elasticsearch en un intervalo de puertos pueden actuar como enrutadores de chismes en el mismo equipo. (Automatic Translation)
elastic.search.configuration.name=Elasticsearch
http-cors-allow-origin-help=Orígenes para permitir al CORS HTTP está habilitado. (Automatic Translation)
http-cors-configurations-help=Ajuste las configuraciones personalizadas para HTTP CORS en formato YML (elastisearch.yml).
http-cors-enabled-help=Si se trata de compartir recursos de marcada, Cruz-origen está habilitada, que determina si un navegador de otro origen puede hacer solicitudes a Elasticsearch. Si, herramientas de front-end como elasticsearch-cabeza pueden ser incapaces de conectar. (Automatic Translation)
http-enabled-help=Si esta casilla está seleccionada, la capa HTTP está habilitada. Si, la capa HTTP en los nodos que no están destinadas a servir el resto pide directamente están deshabilitadas. (Automatic Translation)
index-name-prefix-help=Ajuste el prefijo para el nombre del índice de búsqueda. Este valor no debería cambiarse bajo condiciones normales. Si cambia este valor, debe también reindexar todas las operaciones para el portal y después manualmente eliminar el índice antiguo usando la consola de administración de Elasticsearch.
log-exceptions-only-help=Marcar como verdadero para únicamente mostrar las excepciones de Elasticsearch y no mostrarlas más veces.
network-bind-host-help=La interfaces de red un nodo debe enlazar para escuchar las solicitudes entrantes. (Automatic Translation)
network-host-help=El nombre de host o dirección IP binded al nodo, que se utiliza para publicar (publicidad) el host a otros nodos del clúster. Se trata de un acceso directo que establece el host de lazo y la hostia de publicar al mismo tiempo. (Automatic Translation)
network-publish-host-help=La única interfaz del nodo anuncia a otros nodos del clúster, para que los nodos pueden conectarse a él. (Automatic Translation)
operation-mode-help=El modo de operación REMOTO se conecta a un grupo de Elasticsearch de control remoto independiente. El modo de funcionamiento INTEGRADO inicia Portal con una instancia interna de la Elasticsearch en la misma JVM. No se admite el modo de funcionamiento INTEGRADO. (Automatic Translation)
override-type-mappings-help=Reemplazar las asignaciones para la LiferayDocumentType completa, en formato JSON (Elasticsearch poner mapas API). Si establece este valor, creación de índice ignora la definición de las asignaciones por defecto y cualquier punto de la extensión, utilizando esta definición de asignaciones alternativas en su lugar. Utilice esto si necesita LiferayDocumentType ser creado con asignaciones no estándares para campos por defecto. Si sólo necesita añadir nuevas asignaciones personalizadas sin superposición de cualquier defectos, use additionalTypeMappings. (Automatic Translation)
retry-on-conflict-help=El número de reintentos si se produce un conflicto de versión porque el documento se actualizó entre recuperar y actualizarlo. (Automatic Translation)
transport-addresses-help=Las direcciones de nodo remoto para conectarse. Este valor es requerido cuando el modo de operación se establece a DISTANCIA. (Automatic Translation)
transport-tcp-port-help=El puerto de enlace para la comunicación entre nodos. Acepta un solo valor o un rango (por ejemplo, 9300-9400). (Automatic Translation)