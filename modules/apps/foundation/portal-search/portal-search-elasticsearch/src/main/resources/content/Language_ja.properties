additional-configurations-help=組み込みElasticsearchのカスタム設定をYMLフォーマットで行う(elasticsearch.yml)
additional-index-configurations-help=Liferayインデックスのカスタム設定を、JSON, YML形式で設定する。(Elasticsearch Create Index API)
additional-type-mappings-help=LiferayDocumentTypeのためのカスタムマッピングを、JSON形式で設定する。(Elasticsearch Put Mapping API)
bootstrap-mlockall-help=これにチェックした場合、処理用アドレスはRAMに固定され、Elasticsearchで使用するメモリがスワップされないようになります。
client-transport-ignore-cluster-name-help=これにチェックした場合、接続されているノードのクラスタ名の検証は無視されます
client-transport-nodes-sampler-interval-help=クライアントノードに、接続されていてリストにあるノードに対して、どの程度の頻度でサンプル/pingするか指示してください
client-transport-sniff-help=これにチェックした場合、クラスタ内の有効なノードを動的に発見する際に、クラスタ検索が有効になります
cluster-name-help=クラスタに加わるための名前。実行モードが<code>remote</code>に設定されている場合、名前はリモートクラスタと一致させる必要があります。
discovery-zen-ping-unicast-hosts-port-help=<code>discovery.zen.ping.unicast.hosts</code>を作成する際のポートの範囲。この範囲内のポートで起動している複数のElasticsearchノードは、同じマシン上のGossipルーターとして動作させることができます。
elastic.search.configuration.name=Elasticsearch
http-cors-allow-origin-help=HTTP CORSが有効な時、オリジンとして許可する
http-cors-configurations-help=HTTP CORSのカスタム設定を、YML形式で設定する (elasticsearch.yml)
http-cors-enabled-help=これにチェックした場合、もう１つのオリジンのブラウザからElasticsearchにリクエストを送れる、クロス・オリジンリソース共有が有効になります。無効の場合、Elasticsearch-headなどのWebフロントエンドツールから接続できなくなります。
http-enabled-help=これにチェックした場合、HTTPレイヤーが有効になります。チェックしない場合、全ノードのHTTPレイヤーがRESTリクエストを直接提供しない、という設定が無効になります。
index-name-prefix-help=検索インデックスのためのprefixを設定します。通常はこの値は変更すべきではありません。この値を変更した場合、ポータルの全インデックスの再インデックスと、Elasticsearch 管理者コンソールから旧インデックスを手動で削除する必要があります。
log-exceptions-only-help=これをTrueに設定すると、Elasticsearchからのエクセプションのみロギングするようになり、再度例外をスローしなくなります。
network-bind-host-help=ノードのネットワークインターフェースが、受信リクエストを受け付けるようにバインドされます
network-host-help=ノード名に設定されているホスト名またはIPアドレスが、クラスタ内の他のノードに対して公開するのに利用されます。これはホストにバインドするためのショートカットとして機能し、同時にホストを公開します。
network-publish-host-help=クラスタ内の他のノードが、あるインターフェースのノードに接続できるようにするために、他ノードへ公開します。
operation-mode-help=<code>REMOTE</code>モードは外部のスタンドアローンElasticsearchクラスタに接続します。<code>EMBEDDED</code>モードはLiferay組み込みの、Liferayと同一JVM上で動作するElasticsearchインスタンスを起動します。<code>EMBEDDED</code>モードは本番環境で利用はできません。またサポート対象外となります。
override-type-mappings-help=Override mappings for the entire LiferayDocumentType, in JSON format (Elasticsearch Put Mapping API). If you set this value, index creation ignores the default mappings definition and any extension points, using this alternative mappings definition instead. Use this if you need LiferayDocumentType to be created with nonstandard mappings for default fields. If you just need to add new custom mappings without overlapping any defaults, use additionalTypeMappings. (Automatic Copy)
retry-on-conflict-help=ドキュメントが取得とアップデートの間に更新された際に、バージョン不一致が発生した場合のリトライの回数。
transport-addresses-help=接続先のリモートノードアドレス。この値はオペレーションモードが<code>REMOTE</code>に設定されている場合に必要です。
transport-tcp-port-help=ノード間を接続するためのポート。１つの値もしくは範囲での指定が可能です（例 9300-9400)。