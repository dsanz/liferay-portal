additional-configurations-help=Határozzon meg saját beállításokat a beágyazott Elastisearch-höz, YML formátumban (elasticsearch.yml).
additional-index-configurations-help=Határozzon meg saját beállításokat a Liferay indexhez, JSON vagy YML formátumban (Az Elasticsearch hozza létre az Index API-t).
additional-type-mappings-help=Határozzon meg saját leképezést a Liferay dokumentum típushoz, JSON formátumban (Elastisearch Put Mapping API).
bootstrap-mlockall-help=Ha ez be van jelölve, a folyamat címterületén van zárt-ba RAM, megakadályozza, hogy bármely Elasticsearch memória lét cserélték ki. (Automatic Translation)
client-transport-ignore-cluster-name-help=Ha ez be van jelölve, a fürt neve érvényesítés-ból összekapcsolt csomópontok figyelmen kívül hagyja. (Automatic Translation)
client-transport-nodes-sampler-interval-help=Arra utasítja az ügyfél csomópont milyen gyakran minta/ping a csomópontok felsorolt és összekapcsolt. (Automatic Translation)
client-transport-sniff-help=Ha ez be van jelölve, fürt szippantás dinamikusan felfedezni a fürt elérhető csomópontjain engedélyezve van. (Automatic Translation)
cluster-name-help=The name of the cluster to join. The name should match the remote cluster when Operation Mode is set to <code>remote</code>. (Automatic Copy)
discovery-zen-ping-unicast-hosts-port-help=Range of ports to use when building the <code>discovery.zen.ping.unicast.hosts</code> value. Multiple Elasticsearch nodes on a range of ports can act as gossip routers at the same computer. (Automatic Copy)
elastic.search.configuration.name=Elasticsearch
http-cors-allow-origin-help=Ha engedélyezve van a HTTP CORS hogy eredetét. (Automatic Translation)
http-cors-configurations-help=Határozzon meg saját beállításokat a HTTP CORS-hoz, YML formátumban (elastisearch.yml).
http-cors-enabled-help=Ha az ellenőrzött, kereszt-eredetű erőforrás-megosztás engedélyezve van, amely meghatározza, hogy egy legel-ra más eredetű lehet, hogy kéri Elasticsearch. Ha le van tiltva, webes előtér eszközök, mint a elasticsearch vezetője május lenni képtelen-hoz összeköt. (Automatic Translation)
http-enabled-help=Ha ez be van jelölve, akkor a HTTP-réteg engedélyezve van. Ha nincs bejelölve, a HTTP-réteg teljes egészében a csomópontok, amelyek nem célja, hogy szolgálja a többi kérelmeket közvetlenül le vannak tiltva. (Automatic Translation)
index-name-prefix-help=Állítsa be az előtagot a keresőindex nevéhez. Normál körülmények között ennek az értéknek a módosítása kerülendő. Ha ezt az értéket módosítja, a portál összes műveletét újra indexelnie kell, majd kézi úton törölnie kell a régi indexet az Elastisearch kezelő konzolja segítségével.
log-exceptions-only-help=Kizárólag az Elastisearch kivételeinek a naplózásáért állítsa be igazra, és azért, hogy ne okozzon ismét kivételeket.
network-bind-host-help=A hálózati interfész (ek) egy csomópont kell kötni annak érdekében, hogy a bejövő kérelmek figyeléséhez. (Automatic Translation)
network-host-help=Az állomásnév vagy IP-címét kévekötő munkás, ahhoz a csomóponthoz, amit használnak-hoz közzétesz (hirdetni) az állomás a fürt összes többi csomópontjára. Ez egy parancsikont, amely meghatározza a bind állomást és a közzététel fogadó ugyanabban az időben. (Automatic Translation)
network-publish-host-help=Az egységes interfész a csomópont hirdeti a fürt összes többi csomópontjára, úgy, hogy azokon a csomópontokon, tud összeköt-hoz ez. (Automatic Translation)
operation-mode-help=The <code>REMOTE</code> operation mode connects to a remote standalone Elasticsearch cluster. The <code>EMBEDDED</code> operation mode starts Portal with an internal Elasticsearch instance in the same JVM. The EMBEDDED operation mode is unsupported. (Automatic Copy)
retry-on-conflict-help=Ha változat ütközés lép fel, mert a dokumentum frissítése között kell megkapniuk frissítették az újrapróbálkozások száma. (Automatic Translation)
transport-addresses-help=The remote node addresses to connect to. This value is required when Operation Mode is set to <code>REMOTE</code>. (Automatic Copy)
transport-tcp-port-help=A kikötő-hoz kötődik a csomópontok közti kommunikációban. Fogadja el egyetlen értéket vagy tartományt (pl. 9300-9400). (Automatic Translation)