additional-configurations-help=Defina configurações personalizadas para Elasticsearch incorporado, no formato YML (elasticsearch.yml).
additional-index-configurations-help=Defina configurações personalizadas para o índice da Liferay, no formato JSON ou YML (API de criação de índice no Elasticsearch).
additional-type-mappings-help=Defina mapeamentos personalizados para o LiferayDocumentType, no formato JSON (API Put Mapping do Elasticsearch).
bootstrap-mlockall-help=Se esta opção estiver marcada, o espaço de endereço de processo estará bloqueado na memória RAM, impedindo a permutação de qualquer memória de ElasticSearch.
client-transport-ignore-cluster-name-help=Se isso estiver marcado, a validação de nomes de cluster de nós conectados será ignorada.
client-transport-nodes-sampler-interval-help=Instrui o nó do cliente em com qual frequência consultar/apresentar os nós listados e conectados.
client-transport-sniff-help=Se isso estiver marcado, o spoofing de cluster estará habilitado para descobrir dinamicamente nós disponíveis no cluster.
cluster-name-help=O nome do cluster para participar. O nome deve corresponder ao cluster remoto quando o Modo de Operação é definido como <code>remote</code>.
discovery-zen-ping-unicast-hosts-port-help=Intervalo de Portas que será utilizado para construir o valor de <code>discovery.zen.ping.unicast.hosts</code>. Múltiplos nós do Elasticsearch em um intervalo de Portas podem agir como roteadores disseminadores em um mesmo computador.
elastic.search.configuration.name=Elasticsearch
http-cors-allow-origin-help=Origens para permissão quando o HTTP CORS é habilitado.
http-cors-configurations-help=Defina configurações personalizadas para HTTP CORS, no formato YML (elasticsearch.yml).
http-cors-enabled-help=Se esta opção estiver marcada, o compartilhamento de recurso de origem cruzada é habilitado, o qual determina se um navegador em outra origem pode fazer solicitações para o ElasticSearch. Se desabilitado, ferramentas de front-end web, como elasticsearch-head, podem estar impossibilidatadas de se conectarem.
http-enabled-help=Se esta opção estiver marcada, a camada HTTP está habilitada. Se estiver desmarcada, a camada HTTP, repleta de nós que não são destinados a servir requisições REST diretamente, está desabilitada.
index-name-prefix-help=Defina o prefixo para o nome do índice de pesquisa. Esse valor não deve ser alterado sob condições normais. Se alterar esse valor, você deve também realizar uma operação reindex all para o portal e então excluir manualmente o índice antigo, usando o console de administração do Elasticsearch.
log-exceptions-only-help=Defina como verdadeiro para registrar apenas exceções do Elasticsearch e não relançá-las.
network-bind-host-help=A(s) interface(s) de rede que um nó deve vincular para ouvir as requisições.
network-host-help=O nome do Host ou endereço IP vinculado ao nó, o qual é utilizado para publicar (anunciar) o host para outros nós no Cluster. Este é um atalho que define o host vinculado e o host a publicar simultaneamente.
network-publish-host-help=A única interface que o nó anuncia para outros nós no cluster, para que esses nós possam se conectar a ele.
operation-mode-help=O modo de operação <code>REMOTE</code> se conecta a um cluster ElasticSearch autônomo remoto. O modo de operação <code>EMBEDDED</code> inicializa o Portal com uma instância interna ElasticSearch na mesma JVM. O modo de operação EMBEDDED não possui suporte.
override-type-mappings-help=Substitua os mapeamentos para a LiferayDocumentType inteira, no formato JSON (Elasticsearch colocar mapeamento API). Se você definir esse valor, criação de índice ignora a definição de mapeamentos padrão e quaisquer pontos de extensão, usando esta definição de mapeamentos alternativos em vez disso. Use isto se você precisa LiferayDocumentType a ser criado com mapeamentos padrão para campos padrão. Se você só precisa adicionar novos mapeamentos personalizados sem quaisquer padrões de sobreposição, use additionalTypeMappings. (Automatic Translation)
retry-on-conflict-help=O número de tentativas, se ocorrer um conflito de versão por motivo de atualização do documento, entre recuperá-lo e atualizá-lo.
transport-addresses-help=O nó remoto endereça para se conectar. Este valor é requerido quando o Modo de Operação é definido para <code>REMOTE</code>.
transport-tcp-port-help=A porta para vincular comunicação entre nós. Aceita um único valor ou um intervalo (por exemplo, 9300-9400).