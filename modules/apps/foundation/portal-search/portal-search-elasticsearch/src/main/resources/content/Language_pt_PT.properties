additional-configurations-help=Estabeleça configurações personalizadas para Elasticsearch incorporado, no formato YML (elasticsearch.yml).
additional-index-configurations-help=Introduzir definições para o index do Liferay por omissão, no formato JSON ou YML (API Elasticsearch para criação de índice).
additional-type-mappings-help=Introduzir os mapeamento por omissão para o LiferayDocumentType, no formato JSON ou YML (Elasticsearch Put Mapping API).
bootstrap-mlockall-help=Se isto é verificado, o espaço de endereço de processo é bloqueado na memória RAM, impedindo qualquer memória de Elasticsearch de ser permutada. (Automatic Translation)
client-transport-ignore-cluster-name-help=Se isto estiver marcado, a validação de nome de cluster de nós conectados é ignorada. (Automatic Translation)
client-transport-nodes-sampler-interval-help=Instrui o nó do cliente na freqüência de amostra/ping os nós listados e conectado. (Automatic Translation)
client-transport-sniff-help=Se essa opção está marcada, farejador de cluster é habilitado para detectar dinamicamente disponíveis nós no cluster. (Automatic Translation)
cluster-name-help=The name of the cluster to join. The name should match the remote cluster when Operation Mode is set to <code>remote</code>. (Automatic Copy)
discovery-zen-ping-unicast-hosts-port-help=Range of ports to use when building the <code>discovery.zen.ping.unicast.hosts</code> value. Multiple Elasticsearch nodes on a range of ports can act as gossip routers at the same computer. (Automatic Copy)
elastic.search.configuration.name=Elasticsearch
http-cors-allow-origin-help=Origens para permitir ao CORS HTTP está habilitado. (Automatic Translation)
http-cors-configurations-help=Introduzir definições por omissão para HTTP CORS, no formato YML (elasticsearch.yml).
http-cors-enabled-help=Se isto é verificado, Cruz-origem recurso compartilhamento está habilitado, que determina se um navegador em outra origem pode fazer pedidos para Elasticsearch. Se desativado, ferramentas de front-end web como elasticsearch-cabeça podem ser incapazes de se conectar. (Automatic Translation)
http-enabled-help=Se isto estiver marcado, a camada HTTP está habilitada. Se estiver desmarcada, a camada HTTP inteiramente em nós que não são destinadas a servir o resto solicita diretamente estão desativados. (Automatic Translation)
index-name-prefix-help=Introduzir o prefixo para o nome do índice de pesquisa. Em condições normais, este valor não poderá ser alterado. Se alterar este valor, deve também executar uma operação de reindexação global ao portal, removendo posteriormente os índices antigos, utilizando a consola de administração do Elasticsearch.
log-exceptions-only-help=Colocar a verdade (true) para apenas registar em log as exceções do Elasticsearch, evitando que as mesmas sejam lançadas novamente.
network-bind-host-help=As interfaces de rede, um nó devem vincular a fim escutar solicitações de entrada. (Automatic Translation)
network-host-help=O hostname ou endereço IP uniu-se ao nó, que é usado para publicar (anunciar) host para outros nós do cluster. Este é um atalho que define o host de vincular e o host de publicar ao mesmo tempo. (Automatic Translation)
network-publish-host-help=A única interface no nó anuncia para outros nós do cluster, para que os nós podem se conectar a ele. (Automatic Translation)
operation-mode-help=The <code>REMOTE</code> operation mode connects to a remote standalone Elasticsearch cluster. The <code>EMBEDDED</code> operation mode starts Portal with an internal Elasticsearch instance in the same JVM. The EMBEDDED operation mode is unsupported. (Automatic Copy)
retry-on-conflict-help=O número de repetições se ocorrer um conflito de versão, porque o documento foi atualizado entre recuperá-lo e atualizá-lo. (Automatic Translation)
transport-addresses-help=The remote node addresses to connect to. This value is required when Operation Mode is set to <code>REMOTE</code>. (Automatic Copy)
transport-tcp-port-help=O porto para ligar para a comunicação entre os nós. Aceita um valor único ou um intervalo (por exemplo, 9300-9400). (Automatic Translation)