additional-configurations-help=Estabeleça configurações personalizadas para Elasticsearch incorporado, no formato YML (elasticsearch.yml).
additional-index-configurations-help=Introduzir definições para o index do Liferay por omissão, no formato JSON ou YML (API Elasticsearch para criação de índice).
additional-type-mappings-help=Introduzir os mapeamento por omissão para o LiferayDocumentType, no formato JSON ou YML (Elasticsearch Put Mapping API).
bootstrap-mlockall-help=Se esta opção estiver selecionada, o espaço de endereços do processo está trancado na RAM, prevenindo qualquer memória do Elasticsearch de ser colocada em swap.
client-transport-ignore-cluster-name-help=Se esta opção estiver selecionada, a validação de nome do cluster para os nós conectados é ignorada.
client-transport-nodes-sampler-interval-help=Dá instruções ao nó cliente sobre a frequência de amostragem/ping sobre os nós listados e conectados.
client-transport-sniff-help=Se esta opção estiver selecionada, o cluster sniffing está activo, permitindo descobrir nós disponíveis no cluster.
cluster-name-help=O nome do cluster ao qual se pretende juntar. O nome deve corresponder ao cluster remoto quando o Modo de Operação está definido como <code>remoto</code>.
discovery-zen-ping-unicast-hosts-port-help=Intervalo de portos a utilizar quando a construir o valor <code>discovery.zen.ping.unicast.hosts</code>. Múltiplos nós Elasticsearch num intervalo de portos podem actuar como gossip routers no mesmo computador.
elastic.search.configuration.name=Elasticsearch
http-cors-allow-origin-help=Origens permitidas quando HTTP CORS está activo.
http-cors-configurations-help=Introduzir definições por omissão para HTTP CORS, no formato YML (elasticsearch.yml).
http-cors-enabled-help=Se esta opção estiver selecionada, partilha de recursos com origem cruzada (cross-origin) está activa, o que determina se o browser ou outra origem pode efetuar pedidos ao Elasticsearch. Se desactivado, ferramentas web para a componente de visualização como elasticsearch-head podem não se conseguir conectar.
http-enabled-help=Se esta opção estiver selecionada, a camada HTTP está activa. Se não selecionado, a camada HTTP fica completamente nos nós, os quais não são supostos servir pedidos REST directamente.
index-name-prefix-help=Introduzir o prefixo para o nome do índice de pesquisa. Em condições normais, este valor não poderá ser alterado. Se alterar este valor, deve também executar uma operação de reindexação global ao portal, removendo posteriormente os índices antigos, utilizando a consola de administração do Elasticsearch.
log-exceptions-only-help=Colocar a verdade (true) para apenas registar em log as exceções do Elasticsearch, evitando que as mesmas sejam lançadas novamente.
network-bind-host-help=A(s) Interface(s) de rede a que um nó se deve ligar para receber pedidos.
network-host-help=O hostname ou endereço IP associados ao nó, o qual é utilizado para publicar (advertise) o host para outros nós no cluster. Isto é um atalho que coloca o host associado e o host publicado ao mesmo tempo.
network-publish-host-help=A interface única que o nó publica para outros nós no cluster, de forma a que outros nós possam se conectar a ele.
operation-mode-help=O modo de operação <code>REMOTO</code> conecta-se a um cluster remoto Elasticsearch independente. O modo de operação <code>EMBEBIDO</code> inicia o Portal com uma instância interna de Elasticsearch na mesma JVM. O modo EMBEBIDO não é suportado.
override-type-mappings-help=Substitua os mapeamentos para a LiferayDocumentType inteira, no formato JSON (Elasticsearch colocar mapeamento API). Se você definir esse valor, criação de índice ignora a definição de mapeamentos padrão e quaisquer pontos de extensão, usando esta definição de mapeamentos alternativos em vez disso. Use isto se você precisa LiferayDocumentType a ser criado com mapeamentos padrão para campos padrão. Se você só precisa adicionar novos mapeamentos personalizados sem quaisquer padrões de sobreposição, use additionalTypeMappings. (Automatic Translation)
retry-on-conflict-help=O número de tentativas no caso de ocorrer um conflito de versões quando o documento foi atualizado entre o momento de obtenção e de atualização.
transport-addresses-help=O endereço do nó remoto ao qual se quer conectar. Este valor é obrigatório quando o Modo de Operação é <code>REMOTO</code>.
transport-tcp-port-help=O porto ao qual se ligar para comunicação entre nós. Aceita um valor único ou um intervalo (Exemplo: 9300-9400).