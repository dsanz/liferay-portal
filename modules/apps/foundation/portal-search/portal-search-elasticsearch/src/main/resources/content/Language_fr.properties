additional-configurations-help=Définir les paramètres par défaut pour Elasticsearch intégré en format YML (elasticsearch.yml).
additional-index-configurations-help=Définir les paramètres par défaut pour l'index Liferay dans un format JSON ou YML  (Elasticsearch Create Index API).
additional-type-mappings-help=Définir la cartographie par défaut pour les type de documents Liferay, dans un format JSON  (Elasticsearch Create Index API).
bootstrap-mlockall-help=Si cette case est cochée, l’espace d’adressage de processus est verrouillé dans la mémoire vive, empêchant toute mémoire Elasticsearch d’être permutée. (Automatic Translation)
client-transport-ignore-cluster-name-help=Si cette case est cochée, la validation de nom de cluster de nœuds connectés est ignorée. (Automatic Translation)
client-transport-nodes-sampler-interval-help=Indique le nœud client sur la fréquence d’échantillon/ping les nœuds répertoriés et connecté. (Automatic Translation)
client-transport-sniff-help=Si cette case est cochée, reniflement de cluster est activé pour découvrir dynamiquement les nœuds disponibles dans le cluster. (Automatic Translation)
cluster-name-help=The name of the cluster to join. The name should match the remote cluster when Operation Mode is set to <code>remote</code>. (Automatic Copy)
discovery-zen-ping-unicast-hosts-port-help=Range of ports to use when building the <code>discovery.zen.ping.unicast.hosts</code> value. Multiple Elasticsearch nodes on a range of ports can act as gossip routers at the same computer. (Automatic Copy)
elastic.search.configuration.name=Elasticsearch
http-cors-allow-origin-help=Origines pour permettre lors de la SCRO HTTP est activée. (Automatic Translation)
http-cors-configurations-help=Définir les paramètres par défaut pour HTTP CORS, en format YML (elasticsearch.yml).
http-cors-enabled-help=Si cela est vérifié, Croix-origine des ressources partage est activé, ce qui détermine si un navigateur sur une autre origine peut présenter vos demandes à Elasticsearch. Si désactivé, outils frontaux web tels qu’elasticsearch-tête peuvent être impossible de se connecter. (Automatic Translation)
http-enabled-help=Si cette case est cochée, la couche HTTP est activée. Si non coché, la couche HTTP entièrement sur les nœuds qui ne sont pas destinés à servir de repos demande directement sont désactivées. (Automatic Translation)
index-name-prefix-help=Définissez le préfixe pour le nom de l'index de recherche. En temps normal, cette valeur ne doit pas être modifiée. Si vous modifiez cette valeur, vous devrez également effectuer une réindexation de toutes les opérations du portail et supprimer manuellement l'ancien index en utilisant la console d'administration ElasticSearch.
log-exceptions-only-help=Définir comme vrai afin de connecter les exceptions d'Elasticsearch et de ne pas les relancer.
network-bind-host-help=Les interfaces de réseau un nœud doit lier à pour capter les demandes entrantes. (Automatic Translation)
network-host-help=Le nom d’hôte ou adresse IP lié au nœud, qui est utilisé pour publier l’hôte à d’autres nœuds du cluster (la publicité). Il s’agit d’un raccourci qui établit la liaison ordinateur hôte et le publier en même temps. (Automatic Translation)
network-publish-host-help=L’interface unique du nœud annonce aux autres nœuds du cluster, afin que ces nœuds peuvent se connecter à lui. (Automatic Translation)
operation-mode-help=The <code>REMOTE</code> operation mode connects to a remote standalone Elasticsearch cluster. The <code>EMBEDDED</code> operation mode starts Portal with an internal Elasticsearch instance in the same JVM. The EMBEDDED operation mode is unsupported. (Automatic Copy)
retry-on-conflict-help=Le nombre de tentatives si un conflit de version se produit parce que le document a été mis à jour entre récupérer et mettre à jour. (Automatic Translation)
transport-addresses-help=The remote node addresses to connect to. This value is required when Operation Mode is set to <code>REMOTE</code>. (Automatic Copy)
transport-tcp-port-help=Le port se lier pour la communication entre les nœuds. Accepte une valeur unique ou une plage (par exemple, 9300-9400). (Automatic Translation)