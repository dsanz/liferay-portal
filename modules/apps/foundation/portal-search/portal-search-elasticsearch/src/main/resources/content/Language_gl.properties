additional-configurations-help=Defina as configuracións personalizadas para Elasticsearch incrustado no formato YML (elasticsearch.yml).
additional-index-configurations-help=Defina as configuracións personalizadas para o índice Liferay, no formato JSON ou YML (API de creación de índices Elasticsearch).
additional-type-mappings-help=Introduza os mapeamentos por defecto para o LiferayDocumentType, no formato JSON ou YML (API Put Mapping do Elasticsearch).
bootstrap-mlockall-help=Se isto é seleccionado, o espazo de enderezos do proceso será fixado na RAM, impedindo que a memoria de Elasticsearch sexa movida para o espazo de intercambio (swap).
client-transport-ignore-cluster-name-help=Se isto é seleccionado, a validación do nome de cluster dos nós conectados será ignorado.
client-transport-nodes-sampler-interval-help=Indica ao nó cliente sobre a frecuencia de monitorización dos nós listados e conectados.
client-transport-sniff-help=If this is checked, cluster sniffing is enabled to dynamically discover available nodes in the cluster. (Automatic Copy)
cluster-name-help=The name of the cluster to join. The name should match the remote cluster when Operation Mode is set to <code>remote</code>. (Automatic Copy)
discovery-zen-ping-unicast-hosts-port-help=Range of ports to use when building the <code>discovery.zen.ping.unicast.hosts</code> value. Multiple Elasticsearch nodes on a range of ports can act as gossip routers at the same computer. (Automatic Copy)
elastic.search.configuration.name=Elasticsearch (Automatic Copy)
http-cors-allow-origin-help=Origins to allow when HTTP CORS is enabled. (Automatic Copy)
http-cors-configurations-help=Defina configuracións personalizadas para HTTP CORS, no formato YML (elasticsearch.yml).
http-cors-enabled-help=If this is checked, cross-origin resource sharing is enabled, which determines whether a browser on another origin can make requests to Elasticsearch. If disabled, web front-end tools like elasticsearch-head may be unable to connect. (Automatic Copy)
http-enabled-help=If this is checked, the HTTP layer is enabled. If unchecked, the HTTP layer entirely on nodes which are not meant to serve REST requests directly are disabled. (Automatic Copy)
index-name-prefix-help=Introduza o prefixo para o nome do índice de busca. Em condicións normais, este valor non poderá ser alterado. Se altera este valor, debe tamén executar unha operación de reindexación global ao portal, eliminando posteriormente os índices antigos, utilizando a consola de administración do Elasticsearch.
log-exceptions-only-help=Marcar como verdadeiro para unicamente mostrar as excepcións de Elasticsearch e non mostralas máis veces.
network-bind-host-help=The network interface(s) a node should bind to in order to listen for incoming requests. (Automatic Copy)
network-host-help=The hostname or IP address binded to the node, which is used to publish (advertise) the host to other nodes in the cluster. This is a shortcut which sets the bind host and the publish host at the same time. (Automatic Copy)
network-publish-host-help=The single interface the node advertises to other nodes in the cluster, so that those nodes can connect to it. (Automatic Copy)
operation-mode-help=The <code>REMOTE</code> operation mode connects to a remote standalone Elasticsearch cluster. The <code>EMBEDDED</code> operation mode starts Portal with an internal Elasticsearch instance in the same JVM. The EMBEDDED operation mode is unsupported. (Automatic Copy)
retry-on-conflict-help=The number of retries if a version conflict occurs because the document was updated between retrieving it and updating it. (Automatic Copy)
transport-addresses-help=The remote node addresses to connect to. This value is required when Operation Mode is set to <code>REMOTE</code>. (Automatic Copy)
transport-tcp-port-help=The port to bind for communication between nodes. Accepts a single value or a range (e.g., 9300-9400). (Automatic Copy)