additional-configurations-help=Defina as configuracións personalizadas para Elasticsearch incrustado no formato YML (elasticsearch.yml).
additional-index-configurations-help=Defina as configuracións personalizadas para o índice Liferay, no formato JSON ou YML (API de creación de índices Elasticsearch).
additional-type-mappings-help=Introduza os mapeamentos por defecto para o LiferayDocumentType, no formato JSON ou YML (API Put Mapping do Elasticsearch).
bootstrap-mlockall-help=Se isto é seleccionado, o espazo de enderezos do proceso será fixado na RAM, impedindo que a memoria de Elasticsearch sexa movida para o espazo de intercambio (swap).
client-transport-ignore-cluster-name-help=Se isto é seleccionado, a validación do nome de cluster dos nós conectados será ignorado.
client-transport-nodes-sampler-interval-help=Indica ao nó cliente sobre a frecuencia de monitorización dos nós listados e conectados.
client-transport-sniff-help=Se isto é seleccionado, o sniffing do cluster será activado para descubrir automaticamente nós dispoñibles no cluster.
cluster-name-help=O nome do cluster para se unir. O nome debe coincidir co do cluster remoto cando o modo de operación estea definido a <code>remoto</code>.
discovery-zen-ping-unicast-hosts-port-help=Intervalo de portos a usar na construción do valor <code>discovery.zen.ping.unicast.hosts</code>. Múltiples nós de Elasticsearch nun intervalo de portos compórtanse como routers verbosos nun mesmo ordenador.
elastic.search.configuration.name=Elasticsearch (Automatic Copy)
http-cors-allow-origin-help=Orixes permitidas cando HTTP CORS está activo.
http-cors-configurations-help=Defina configuracións personalizadas para HTTP CORS, no formato YML (elasticsearch.yml).
http-cors-enabled-help=Se esta opción está seleccionada, a compartición de recursos de orixe cruzada é activado, o cal determina se un navegador noutra orixe pode facer solicitudes para ElasticSearch. Se é desactivado, ferramentas front-end web como ElasticSearch-head poderían non ser capaces de conectarse.
http-enabled-help=Se isto está seleccionado, a capa HTTP é activada. Se non está activada, a capa HTTP completa nos nós que non sexan destinados a servir peticións REST serán directamente desactivados.
index-name-prefix-help=Introduza o prefixo para o nome do índice de busca. Em condicións normais, este valor non poderá ser alterado. Se altera este valor, debe tamén executar unha operación de reindexación global ao portal, eliminando posteriormente os índices antigos, utilizando a consola de administración do Elasticsearch.
log-exceptions-only-help=Marcar como verdadeiro para unicamente mostrar as excepcións de Elasticsearch e non mostralas máis veces.
network-bind-host-help=A(s) interface(s) de rede na(s) que un nó debería escoitar peticións de entrada.
network-host-help=O nome do servidor ou enderezo IP ligado a este nó, o cal é usado para publicar (anunciar) o host a outros nós no cluster. Este é un atallo que establece o host de escoita e o host de publicación ao mesmo tempo.
network-publish-host-help=A interface simple na que o nó é publicado a outros nós no cluster, de maneira que estes nós poidan conectar con el.
operation-mode-help=O modo de operación <code>REMOTE</code> establece a conexión a un cluster Elasticsearch remoto. O modo de operación <code>EMBEDDED</code> arranca o Portal cunha instancia de ElasticSearch interna na mesma JVM. O modo de operación EMBEDDED non está soportado.
override-type-mappings-help=Override mappings for the entire LiferayDocumentType, in JSON format (Elasticsearch Put Mapping API). If you set this value, index creation ignores the default mappings definition and any extension points, using this alternative mappings definition instead. Use this if you need LiferayDocumentType to be created with nonstandard mappings for default fields. If you just need to add new custom mappings without overlapping any defaults, use additionalTypeMappings. (Automatic Copy)
retry-on-conflict-help=O número de reintentos se un conflito de versión acontece porque o documentos foi subido entre unha consulta e unha actualización.
transport-addresses-help=Os enderezos dos nós remotos aos que se conectar. O valor é obrigatorio cando modo de operación está establecido a <code>REMOTE</code>.
transport-tcp-port-help=O porto no que é feita a comunicación entre nós. Acepta un valor simple ou un intervalo (ex.: 9300-9400).