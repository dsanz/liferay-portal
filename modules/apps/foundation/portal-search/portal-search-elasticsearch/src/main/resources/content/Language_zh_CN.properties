additional-configurations-help=为嵌入式弹性搜索以YML格式开启自定义设置（弹性搜索.yml）。
additional-index-configurations-help=以JSON或YML的格式为Liferay索引设置自定义（弹性搜索创建索引API）。
additional-type-mappings-help=以JSON格式为Liferay文档类型设置自定义映射（弹性搜索映射API）。
bootstrap-mlockall-help=如果选择此项，进程地址空间将被锁定到RAM中，为了防止任何Elasticsearch内存被替换。
client-transport-ignore-cluster-name-help=如果选择此项，连接节点的集群名称验证将被忽略。
client-transport-nodes-sampler-interval-help=指导客户端节点多长时间尝试/Ping一次列出的和相连接的节点。
client-transport-sniff-help=如果选择此项，启用集群嗅探动态搜索集群中的可用节点。
cluster-name-help=要加入集群的名称。当操作模式设置为 <code>远程</code>时，此名称应与远程集群匹配。
discovery-zen-ping-unicast-hosts-port-help=当创建 <code>discovery.zen.ping.unicast.hosts</code>值时，使用的端口范围。一系列端口上的多个Elasticsearch节点可以作为Gossip Router运行在同一台计算机上。
elastic.search.configuration.name=弹性搜索
http-cors-allow-origin-help=当启用HTTP CORS时，允许源。
http-cors-configurations-help=以YML格式为HTTP CORS 设置自定义（弹性搜索，yml）
http-cors-enabled-help=如果选择此项，将启用跨源资源共享，这决定了其他源上的浏览器是否可以发送请求到Elasticsearch。如果禁用此项，网页前端工具如Elasticsearch-head可能无法连接。
http-enabled-help=如果选择此项，将启动HTTP层。如果不选择此项，完全在节点上不直接服务REST请求的HTTP层将被禁用。
index-name-prefix-help=为搜索索引名称设置前缀。在正常条件下，此值不更改。如果您要更改此值，您必须重新执行搜索门户的所有操作，然后使用弹性搜索管理控制台手动删除旧的索引。
log-exceptions-only-help=只有弹性搜索日志异常设置此为真，并不会重新引发他们。
network-bind-host-help=网络接口的节点应绑定用来捕捉传入请求。
network-host-help=主机名或IP地址绑定到此节点，用于发布（通知）主机到此集群中的其他节点。这是可以同时设置绑定主机和发布主机的快捷方式。
network-publish-host-help=单一接口的节点可以向集群中的其他节点发送通知，这样其他节点就可以与它进行连接。
operation-mode-help=<code>REMOTE</code>操作模式连接到远程单一Elasticsearch集群。<code>EMBEDDED</code>操作模式在同一个JAM中通过内部 Elasticsearch实例启动Portal。不支持EMBEDDED操作模式。
override-type-mappings-help=覆盖整个 LiferayDocumentType，以 JSON 格式 (Elasticsearch 把映射 API) 映射。如果您设置此值，索引创建忽略默认映射定义和任何扩展点，改用这种替代映射定义。如果你需要 LiferayDocumentType 可以使用非标准映射为默认字段创建，使用该选项。如果你只需要添加新的自定义映射而不重叠的任何默认值，请使用 additionalTypeMappings。 (Automatic Translation)
retry-on-conflict-help=如果文档在恢复和更新过程被更新而产生版本冲突，用户进行重试的次数。
transport-addresses-help=远程节点地址连接到。当操作模式设置为<code>REMOTE</code>时，此值是必需的。
transport-tcp-port-help=要绑定节点间通信的端口。允许单一的值或范围（如，9300-9400）。