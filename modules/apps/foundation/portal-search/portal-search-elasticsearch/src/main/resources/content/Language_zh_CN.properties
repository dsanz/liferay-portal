additional-configurations-help=为嵌入式弹性搜索以YML格式开启自定义设置（弹性搜索.yml）。
additional-index-configurations-help=以JSON或YML的格式为Liferay索引设置自定义（弹性搜索创建索引API）。
additional-type-mappings-help=以JSON格式为Liferay文档类型设置自定义映射（弹性搜索映射API）。
bootstrap-mlockall-help=如果选中此项，进程的地址空间被锁定到 RAM，防止任何 Elasticsearch 内存被换出。 (Automatic Translation)
client-transport-ignore-cluster-name-help=如果选中了此选项，则忽略连接的节点的群集名称验证。 (Automatic Translation)
client-transport-nodes-sampler-interval-help=指示如何经常样品/坪的节点列出和连接上的客户端节点。 (Automatic Translation)
client-transport-sniff-help=如果选中了此选项，群集嗅探被启用动态发现可用群集中的节点。 (Automatic Translation)
cluster-name-help=The name of the cluster to join. The name should match the remote cluster when Operation Mode is set to <code>remote</code>. (Automatic Copy)
discovery-zen-ping-unicast-hosts-port-help=Range of ports to use when building the <code>discovery.zen.ping.unicast.hosts</code> value. Multiple Elasticsearch nodes on a range of ports can act as gossip routers at the same computer. (Automatic Copy)
elastic.search.configuration.name=弹性搜索
http-cors-allow-origin-help=允许启用 HTTP CORS 的起源。 (Automatic Translation)
http-cors-configurations-help=以YML格式为HTTP CORS 设置自定义（弹性搜索，yml）
http-cors-enabled-help=如果这是签、 跨起源的资源共享被启用，这决定了是否上另一个起源的浏览器可以向 Elasticsearch 发出请求。如果禁用，像 elasticsearch 头 web 前端工具可能无法连接。 (Automatic Translation)
http-enabled-help=如果选中了此选项，启用 HTTP 层。如果不加以控制，完全上不只是其余的节点的 HTTP 层请直接被禁用。 (Automatic Translation)
index-name-prefix-help=为搜索索引名称设置前缀。在正常条件下，此值不更改。如果您要更改此值，您必须重新执行搜索门户的所有操作，然后使用弹性搜索管理控制台手动删除旧的索引。
log-exceptions-only-help=只有弹性搜索日志异常设置此为真，并不会重新引发他们。
network-bind-host-help=网络接口的节点应绑定到以侦听传入请求。 (Automatic Translation)
network-host-help=主机名或 IP 地址绑定到的节点，用于发布 （广告） 主机到群集中其他节点。这是一个快捷方式，在同一时间设置绑定主机和发布主机。 (Automatic Translation)
network-publish-host-help=单一接口节点公布给群集中其他节点，这些节点可以连接到它。 (Automatic Translation)
operation-mode-help=The <code>REMOTE</code> operation mode connects to a remote standalone Elasticsearch cluster. The <code>EMBEDDED</code> operation mode starts Portal with an internal Elasticsearch instance in the same JVM. The EMBEDDED operation mode is unsupported. (Automatic Copy)
retry-on-conflict-help=如果发生版本冲突的原因之间进行检索和更新它更新了文档的重试次数。 (Automatic Translation)
transport-addresses-help=The remote node addresses to connect to. This value is required when Operation Mode is set to <code>REMOTE</code>. (Automatic Copy)
transport-tcp-port-help=要绑定节点间通信的端口。接受一个单一的值或范围 (例如，9300 9400)。 (Automatic Translation)