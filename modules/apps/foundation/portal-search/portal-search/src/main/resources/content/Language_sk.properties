permission-terms-limit-help=Nastaviť obmedzenie počtu povolení hľadaných výrazov, ktoré sa pridajú do vyhľadávacieho dotazu. Ak je prekročený tento limit, pridá sa žiadne povolenie hľadaných výrazov. Namiesto toho povolenie kontroly padne späť na filter hľadania povolenie. (Automatic Translation)
