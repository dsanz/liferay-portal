include-inherited-permissions-help=Maque isto como verdadeiro para incluir o rol herdado dun usuario como parte dos filtros dos permisos de procura. Os roles herdados dun usuario inclúen todos os usuarios asignados a un usuario do seu grupo de usuarios e afiliacións de organización.
index-commit-immediately-help=Estableza esta opción como verdadeira para efectuar o commit inmediato das peticións de escrita nos índices de busca. Establecer esta opción como verdadeira pode impactar negativamente no rendemento do motor de busca, unha vez que cada petición de escrita vai forzar o motor de busca a refrescar o lector do índice e potencialmente, provocar descargas transacionais para disco. O comportamento por defecto do portal é efectuar o commit inmediatamente para operacións sobre índices individuais (ex. engadir blog, actualizar blog), mais atrasar os commits para operacións en bloque (Ex. indexar todos os usuarios, indexar todos os wikis) até que todas as entradas teñan sido enviadas para o motor de busca. Establecer esta opción a falso pode resultar en que algúns portlets como o Publicador de Contidos mostren algún tempo de espera nas respostas cando estean presentando contido recén engadido. Por exemplo, os usuarios poden experimentar algumha demora co motor de busca por defecto Elasticsearch. Ver https://www.elastic.co/guide/en/elasticsearch/guide/current/near-real-time.html para máis información.
