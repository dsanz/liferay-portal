permission-terms-limit-help=Defina isto para limitar o número de termos de busca de permisos que serán engadidos á consulta da pesquisa. Se este límite fose excedido, ningún termo de busca de permisos será engadido. Ao contrario disto, a comprobación de permisos será retornada ao filtro de busca de permisos.
