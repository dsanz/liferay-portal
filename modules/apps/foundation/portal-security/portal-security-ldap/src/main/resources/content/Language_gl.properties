authentication-search-filter-help=Introduza o filtro de procura que é usado para verificar a validez dun usuario. Os tokens @company_id@, @email_address@, @screen_name@, and @user_id@ son substituídos en tempo de execución cos valores correctos.
autogenerate-user-password=Xerar automaticamente o contrasinal de usuario
base-dn-help=A Base DN especifica o contexto de procura inicial para usuarios e é opcional.
contact-custom-mappings-help=Ao importar e exportar usuarios, o portal vai utilizar ese mapeamento para vincular os atributos do usuario LDAP cos atributos personalizados dos contactos do portal.
contact-mappings-help=Ao importar e exportar utilizadores, o portal vai utilizar ese mapeamento para vincular os atributos do usuario LDAP cos atributos do contacto no portal.
create-role-per-group=Crear un rol por grupo
default-user-password=Contrasinal por defecto do usuario
enable-group-cache=Activar caché de grupo
enable-user-password=Activar contrasinal de usuario
export-enabled-help=Configuración para exportación de usuarios do portal para o LDAP. Iso permite que un usuario poida modificar o seu nome, apelido, etc. no portal e que esas modificacións sexan registradas no servidor LDAP. Esa configuración non é utilizada a non ser que a propiedade "LDAPAuthConfiguration.enabled" sexa establecida como verdadeira.
export-group-enabled-help=Marque esta opción como verdadeira se os grupos e as súas asociacións deben ser exportados do portal para o LDAP. Esta configuración non é utilizada a non ser que a propiedade "LDAPAuthConfiguration.enabled" sexa establecida como verdadeira.
group-default-object-classes-help=Cando un grupo é exportado a LDAP e o grupo non existe, o grupo será creado coas seguintes clases de obxecto por defecto.
group-mappings-help=Ao importar grupos, o portal vai utilizar estes mapeamentos para vincular os atributos de grupos LDAP e atributos de grupo de usuarios do portal.
group-search-filter-enabled-help=Configuracións para importar grupos desde o LDAP no portal. Estas configuracións non son usadas a non ser que a propiedade "LDAPImportConfiguration.enabled" sexa establecida a verdadeiro.
groups-dn-help=Novos grupos serán creados no DN especificado. Isto só terá efecto se as propiedades "LDAPAuthConfiguration.enabled" e "LDAPExportConfiguration.enabled" son establecidas como verdadeiras.
import-create-role-per-group-help=Marque isto como verdadeiro se o portal debe crear automáticamente un rol para cada grupo importado do LDAP. O rol será vinculado ao grupo de maneira que os usuarios poidan herdar automaticamente a función cando sexan vinculados ao grupo.
import-group-cache-enabled-help=Especifica se a procura de grupos DN deberá ser colocada en caché durante a importación de LDAP e autenticación. Se é marcada como verdadeira acelerará a autenticación e importación do LDAP, mais as actualizacións de atributos dos grupos non serán recoñecidas até que as entradas na caché sexan expiradas. O tamaño e timeout da caché poden ser configurados utilizando o nome da cache "com.liferay.portal.security.exportimport.UserImporter".
import-lock-expiration-time-help=Defina o tempo de expiración de bloqueo de importación LDAP. Por defecto, o tempo de expiración é de 1 día.
import-method=Método de importación
import-method-help=Defina o usuario ou grupo de usuarios para o método de importación. Se é seleccionado usuario, o portal importa todos os usuarios e os grupos asociados a eses usuarios. Se é seleccionado grupo, o portal importa todos os grupos e os usuarios asociados a eses grupos. Este valor debe ser definido de acordo coa forma que o seu servidor LDAP almacena a asociación de grupos.
ldap.auth.configuration.name=Autenticación LDAP
ldap.export.configuration.name=Exportación LDAP
ldap.import.configuration.name=Importación LDAP
ldap.server.configuration.name=Servidores LDAP
lock-expiration-time=Tempo de expiración do bloqueo
method-help=Estableza bind ou comparación de contrasinais para o método de autenticación LDAP. Bind é o método de preferencia da maioría dos vendedores de forma que non é preciso preocuparse con estratexias de encriptación.
page-size-help=Configure o tamaño de paxinación para servidores de directorios que soportan paxinación. Este valor debe ser 1000 ou menor para o Microsoft Active Directory Server.
password-encryption-algorithm-help=Configure a encriptación de contrasinal a ser utilizada na comparación de contrasinais durante a importación e para a encriptación durante a exportación. A comparación de contrasinais durante a importación soamente será feita se a propiedade "LDAPAuthConfiguration.method" está configurada como comparación de contrasinais (password-compare). Se a encriptación está configurada como NONE, que é o valor por defecto, os contrasinais serán considerados como texto simple. O algoritmo SHA-512 non é compatible actualmente.
password-policy-enabled-help=Seleccione esta opción como verdadeira para utilizar a política de contrasinais do LDAP en vez da política de contrasinais do portal. Se é marcado como verdadeiro, é posible que os contrasinais xerados polo portal non correspondan á política de contrasinais do LDAP. Consulte as propiedades "passwords.regexptoolkit.*" para obter detalles sobre como configurar as RegExpToolkit, utlizadas na xeración destes contrasinais.
range-size-help=Define o número de valores a retornar en cada consulta para un atributo multivalor, para servidores de directorios que soportan obtencións por intervalo. O tamaño do intervalo debe ser 1000 ou menos para Windows 2000 e 1500 ou menos para Windows Server 2003.
system.ldap.configuration.name=Sistema LDAP
user-custom-mappings-help=Ao importar e exportar usuarios, o portal utilizará este mapeamento para vincular atributos do usuario LDAP cos atributos personalizados do usuario do portal.
user-default-object-classes-help=Cando un usuario é exportado para o LDAP e o usuario non existe, o usuário será creado coas seguintes clases de obxecto por defecto.
user-ignore-attributes-help=Configure os atributos de usuario que serán controlados polo portal. Ao engadir ou actualizar un usuario do LDAP, estes atributos serán ignorados.
user-mappings-help=Ao importar e exportar usuarios, o portal utilizará este mapeamento para vincular atributos do usuario LDAP cos atributos do usuario do portal.
user-search-filter-help=Configuración para a importación de usuarios desde o LDAP ao portal. Esta configuración non será aplicada a non ser que a propiedade "LDAPImportConfiguration.enabled" sexa establecida como verdadeira.
users-dn-help=Novos usuarios serán creados na DN especificada. Isto só ficará activo se as propiedades "LDAPAuthConfiguration.enabled" e "LDAPExportConfiguration.enabled" fosen configuradas como verdadeiras.