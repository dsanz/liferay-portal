delete.depth.description=Estableza a profundidade das entradas CMIS asignadas para seren eliminadas cando sexa solicitada unha eliminación desde o portal. Canto máis profundo sexa o axuste, máis chamadas ao servidor serán necesarias. Cando unha orde de eliminación é enviada desde fóra do portal, as entradas CMIS asignadas permanecerán estancadas na base de datos. Os valores esperados son: -1 para profundo, 0 para ningún y 1 para superficial.
