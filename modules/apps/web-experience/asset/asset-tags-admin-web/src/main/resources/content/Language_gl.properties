javax.portlet.description.com_liferay_asset_tags_admin_web_portlet_AssetTagsAdminPortlet=Os marcadores permiten a categorización do contido a través de grupos flexibles de termos e vocabularios predefinidos. Os administradores poden xestionar todos os marcadores, atribuir permisos e configurar opcións avanzadas. Os usuarios poden xestionar os seus marcadores e definir conxuntos de marcadores e categorías para utilizar no momento de clasificar contido.
