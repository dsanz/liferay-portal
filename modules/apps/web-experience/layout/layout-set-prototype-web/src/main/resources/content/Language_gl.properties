allow-site-administrators-to-modify-pages-associated-with-this-site-template=Permita que os administradores do sitio modifiquen as páxinas asociadas a este modelo de sitio, mesmo cando a propagación das modificacións estivese habilitada.
allow-site-administrators-to-modify-pages-associated-with-this-site-template-help=Active esta opción para permitir que os administradores do sitio podan engadir, eliminar, ou configurar aplicacións e modificar propiedades de páxinas. Se un administrador modifica unha páxina, as modificacións ao seu modelo de sitio orixinal deixarán de ser propagadas. Se esta opción estivese activa, será posible impedir a modificación de páxinas específicas a través da ferramenta de xestión de páxinas.
