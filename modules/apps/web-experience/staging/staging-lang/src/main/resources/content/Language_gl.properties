staged-portlets-alert=Cando un portlet é seleccionado, os seus datos son copiados para staging e pode non ser posible editalos directamente no contorno de live. Ao desmarcar un portlet, asegúrese de que calesquera modificacións feitas en staging sexan publicadas primeiro, en caso contrario, poderían ser perdidas.
staged-portlets-help=Portlets que están marcados están <em>En Staging</em>. Isto significa que os seus datos serán publicados automaticamente sempre que unha páxina que as conteña sexa publicada. Os portlets que están desabilitados e marcados serán sempre exportados automaticamente, mesmo que eles non estean na páxina. Aqueles que están desactivados e desmarcados nunca serán publicados automaticamente. Portlets de <em>Colaboración</em>, tais como <em>Blogs</em>, <em>Foro</em> e <em>Wiki</em> son excluídos de <em>Staging</em> por defecto, unha vez que tipicamente, a súa información é proveniente de live. Efectivamente, cando un portlet non está <em>En Staging</em> o contorno <em>Live</em> contén os únicos datos importantes. Cando o staging <em>Local Live</em> é utilizado, a mesma información é presentada independentemente do contorno de visualización do portlet.
