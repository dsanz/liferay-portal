remote-publish-help=Para poder publicar cambios nun <em>Servidor Remoto</em>, o servidor de publicación debe estar engadido na lista de servidores permitidos. Faise engadindo a IP do servidor de publicación na propiedade <code>tunnel.servlet.hosts.allowed</code> no ficheiro <code>portal-ext.properties</code> do servidor destino. O <em>Contexto de Servidor Remoto</em> só será necessário se o portal estivese a utilizar un servlet com contexto que non sexa raíz no servidor remoto. Nese caso, o acceso a ese contexto no servidor de destino non debe ser bloqueado por ningún proxy ou firewall. Se o servidor de destino fose un cluster, é posible especificar como <em>Servidor Remoto</em> o enderezo do balanceador para aumentar a alta dispoñibilidade do proceso de publicación.
