custom-field-hidden-help=将自定义字段设置为该字段的值永远不会显示在任何用户界面，除了这本的隐藏手段。这让字段用于更晦涩和先进的用途，例如充当占位符的自定义权限。 (Automatic Translation)
custom-field-index-type-help=将自定义字段设置为可搜索意味着修改实体 (如用户) 时，编制了索引字段的值。只有 java.lang.String 字段可搜索。请注意，当一个字段新做的可搜索，必须更新索引之前的数据是可用来搜索。 (Automatic Translation)
custom-field-key-help=The custom field key is used to access the field programatically through the &lt;liferay-ui:custom-attribute /&gt; tag.
custom-field-secret-help=将自定义字段设置为秘密意味着这么多的打字是隐藏在屏幕上。使用此密码。 (Automatic Translation)
custom-field-visible-with-update-permission-help=将一个自定义字段设置为更新权限可见意味着一个拥有更新权限的用户能够查看这一字段。在这种情况下，这项设置会覆盖隐藏值。
custom-fields-are-not-enabled-for-any-resource=未启用对任何资源的自定义字段功能。
