custom-field-display-type-help=Especifica quin tipus de control s'utilitza per definir aquest camp.
custom-field-height-help=Estableix l'alçada del camp d'entrada en píxels. (Automatic Translation)
custom-field-hidden-help=Creació d'un camp personalitzat per mitjans ocults que valor del camp es mostra mai en qualsevol interfície d'usuari a més d'aquest. Això permet el camp destinats amb finalitats més obscurs i avançades, actuant com un contenidor per a permisos de costum. (Automatic Translation)
custom-field-index-type-help=Creació d'un camp personalitzat per searchable significa que el valor del camp és indexada quan es modifica l'entitat (com a usuari). Només java.lang.String camps es poden fer cerques. Tingueu en compte que quan un camp novament es fa cercable, els índexs cal actualitzar abans de les dades està disponibles a la recerca. (Automatic Translation)
custom-field-key-help=The custom field key is used to access the field programatically through the &lt;liferay-ui:custom-attribute /&gt; tag.
custom-field-secret-help=Creació d'un camp personalitzat per mitjans secreta que escrivint està amagada a la pantalla. Utilitzeu contrasenyes. (Automatic Translation)
custom-field-visible-with-update-permission-help=Configurar un camp personalitzat com a visible amb el permís actualitzat significa que un usuari amb un permís d'aquestes característiques pot visualitzar aquest camp. Aquesta configuració sobreescriu el valor del que està ocult en aquest cas.
custom-fields-are-not-enabled-for-any-resource=Els camps personalitzats no estan habilitats per a cap recurs.
