custom-field-hidden-help=زمینه سفارشی تنظیم به معنی پنهان است که مقدار فیلد است که هرگز در هیچ رابط کاربر علاوه بر این یک نشان داده شده است. این اجازه می دهد تا زمینه برای اهداف مبهم و پیشرفته تر مانند اقدام به عنوان یک حفره یا سوراخ برای سفارشی مجوز مورد استفاده قرار گیرد. (Automatic Translation)
custom-field-index-type-help=زمینه سفارشی تنظیم به معنی جستجو کنید که مقدار فیلد نمایه شده است هنگامی که نهاد (مانند کاربر) تغییر یافته است. فقط java.lang.String زمینه های قابل جستجو می تواند به صورت. توجه هنگامی که یک میدان تازه قابل جستجو ساخته شده، که شاخص قبل از داده ها به روز شود باید به جستجو در دسترس است. (Automatic Translation)
custom-field-key-help=The custom field key is used to access the field programatically through the &lt;liferay-ui:custom-attribute /&gt; tag.
custom-field-secret-help=زمینه سفارشی تنظیم به معنی مخفی که تایپ در صفحه پنهان است. با استفاده از این کلمات عبور. (Automatic Translation)
custom-field-visible-with-update-permission-help=تنظیمات فیلد سفارشی قابل دیدن با مجوز به روز رسانی بدان معنی است که یک کاربر با مجوز به روز رسانی می توانید این فیلد را ببینید. این تنظیم را لغو ارزش پنهان در این مورد. این تنظیمات باعث لغو مقادیر پنهان خواهد شد.
