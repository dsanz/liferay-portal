allow-dictionary-words=Autoriser les mots du dictionnaire
allow-dictionary-words-help=If this is checked, common dictionary words are allowed in the user's passwords.
change-required=Modification nécessaire
change-required-help=If this is checked, a user is required to change their password when they first log in.
changeable=Variable
changeable-help=If this is checked, the user can change their password.
do-not-warn=Ne pas alerter
enable-expiration=Enable Expiration
enable-expiration-help=If this is checked, the user must change their password after a given amount of time.
enable-history=Enable History
enable-history-help=If this is checked, the portal keeps a history of the user's previous passwords and prevents them from reusing an old password.
enable-lockout=Enable Lockout
enable-lockout-help=If this is checked, a user can attempt to log in a certain number of times before their account is locked.
enable-syntax-checking=Enable Syntax Checking
enable-syntax-checking-help=If this is checked, the password is read for certain words and/or a certain length.
grace-limit=Durée de vie
grace-limit-help=This determines the number of times a user can log in after their password has expired, before they are required to enter a new password.
history-count=Nombre d'éléments de l'historique
history-count-help=Ceci détermine le nombre de mots de passe à garder dans l'historique.
javax.portlet.description.com_liferay_password_policies_admin_web_portlet_PasswordPoliciesAdminPortlet=Les politiques de mot de passe définissent les mesures de sécurité de niveau d'entreprise qui incluent le verrouillage d'utilisateur et l'expiration de mot de passe. Les administrateurs peuvent définir les politiques ou le délégué à un serveur de LDAP.
javax.portlet.title.com_liferay_password_policies_admin_web_portlet_PasswordPoliciesAdminPortlet=Politiques de mot de passe
lockout-duration=Durée De Verrouillage
lockout-duration-help=Ceci détermine la quantité de temps pendant laquelle le compte d'un utilisateur est verrouillé.
maximum-age=Âge Maximum
maximum-age-help=Cette option détermine le temps pendant lequel un mot de passe est valide avant qu'il ne doive être changé.
maximum-failure=Échec Maximum
maximum-failure-help=This determines the maximum number of times that a user can attempt to log in with the wrong password.
minimum-age=Âge minimum
minimum-age-help=Cette option détermine le temps minimal qu'un utilisateur doit attendre avant de changer son mot de passe
minimum-alpha-numeric=Alpha numérique minimum
minimum-alpha-numeric-help=Ceci détermine le nombre minimum d'alpha lettres numériques dans l'user
minimum-length=Longueur Minimum
minimum-length-help=Cette option détermine la taille minimum d'un mot de passe utilisateur.
minimum-lower-case=Lettre minuscule minimum
minimum-lower-case-help=Ceci détermine le nombre minimum de lettres minuscules dans l'user
minimum-numbers=Nombres minimum
minimum-numbers-help=Ceci détermine le nombre minimum de nombres dans l'user'mot de passe de s.
minimum-symbols=Symboles minimum
minimum-symbols-help=Ceci détermine le nombre minimum de symboles dans l'user
minimum-upper-case=Haut de casse minimum
minimum-upper-case-help=Ceci détermine le nombre minimum de lettres majuscules dans l'user
password-expiration=Expiration De Mot de passe
password-history=Historique des mots de passe
password-policies=Politiques De Mot de passe
password-syntax-checking=Vérification de syntaxe du mot de passe
reset-failure-count=Remettre à zéro le compteur d'échecs
reset-failure-count-help=Cette option détermine la période de temps pendant laquelle les tentatives de connexion échouées d'un utilisateur sont sauvées.
reset-ticket-max-age=Réinitialiser l'âge maximal des tickets
reset-ticket-max-age-help=Ceci détermine combien de temps un lien de remise de mot de passe est valide.
the-password-policy-could-not-be-found=The password policy could not be found.
until-unlocked-by-an-administrator=Jusqu'à être dévérouillé par un administrateur
warning-time=Délai d'avertissement
warning-time-help=Cette option détermine le temps à attendre avant qu'un utilisateur soit averti que son mot de passe est expiré.
when-no-password-policy-is-assigned-to-a-user,-either-explicitly-or-through-an-organization,-the-default-password-policy-is-used=When no password policy is assigned to a user, either explicitly or through an organization, the default password policy is used.
you-are-using-ldaps-password-policy=Vous employez la politique du mot de passe de LDAP. Veuillez changer votre politique de mot de passe de LDAP si vous souhaitez employer une politique locale de mot de passe.