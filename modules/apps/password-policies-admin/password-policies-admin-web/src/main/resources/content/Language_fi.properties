allow-dictionary-words=Salli sanakirjan sanat
allow-dictionary-words-help=If this is checked, common dictionary words are allowed in the user's passwords.
change-required=Muutos vaadittu
change-required-help=If this is checked, a user is required to change their password when they first log in.
changeable=Muutettavissa
changeable-help=If this is checked, the user can change their password.
do-not-warn=Älä varoita
enable-expiration=Enable Expiration
enable-expiration-help=If this is checked, the user must change their password after a given amount of time.
enable-history=Enable History
enable-history-help=If this is checked, the portal keeps a history of the user's previous passwords and prevents them from reusing an old password.
enable-lockout=Enable Lockout
enable-lockout-help=If this is checked, a user can attempt to log in a certain number of times before their account is locked.
enable-syntax-checking=Enable Syntax Checking
enable-syntax-checking-help=If this is checked, the password is read for certain words and/or a certain length.
grace-limit=Rajoitus
grace-limit-help=This determines the number of times a user can log in after their password has expired, before they are required to enter a new password.
history-count=Historian määrä
history-count-help=Tämä määrittää vanhojen salasanojen määrän, jotka pidetään muistissa.
javax.portlet.description.com_liferay_password_policies_admin_web_portlet_PasswordPoliciesAdminPortlet=Salasanakäytännöt määrittelevät yritystasolla käyttäjätunnuksiin ja salasanoihin littyvät turvallisuuskäytänteet, joihin kuuluvat käyttäjätunnuksen lukitseminen ja salasanan vanheneminen. Ylläpitäjät voivat määrittää käytäntöjä tai delegoida niitä LDAP-palvelimelle.
javax.portlet.title.com_liferay_password_policies_admin_web_portlet_PasswordPoliciesAdminPortlet=Salasanakäytännöt
lockout-duration=Lukituksen kesto
lockout-duration-help=Tämä määrittää kuinka kauan käyttäjän tunnus on lukittuna.
maximum-age=Maksimi ikä
maximum-age-help=Tämä määrittää kuinka pitkään salasana kelpaa ennen kuin se pitää vaihtaa.
maximum-failure=Maksimi epäonnistumiset
maximum-failure-help=This determines the maximum number of times that a user can attempt to log in with the wrong password.
minimum-age=Vähimmäisikä
minimum-age-help=Tämä määrittää kuinka kauan käyttäjän täytyy odottaa ennen kuin hän voi vaihtaa salasanan uudelleen.
minimum-alpha-numeric=Minimimärä alphanumeerisia
