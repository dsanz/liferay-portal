reset-ticket-max-age-help=Määrittelee kuinka kauan salasanan vaihtolinkki on kelvollinen.
the-password-policy-could-not-be-found=The password policy could not be found.
until-unlocked-by-an-administrator=Lukittu kunnes ylläpitäjä avaa.
warning-time=Varoitusaika
warning-time-help=Tämä määrittää kuinka kauan ennen salasanan vanhenemista käyttäjälle ilmoitetaan siitä.
when-no-password-policy-is-assigned-to-a-user,-either-explicitly-or-through-an-organization,-the-default-password-policy-is-used=When no password policy is assigned to a user, either explicitly or through an organization, the default password policy is used.
you-are-using-ldaps-password-policy=Käytät LDAP-palvelimen salasanakäytäntöjä. Muuta asetus LDAP-asetuksista mikäli haluat käyttää paikallista käytäntöjä.
