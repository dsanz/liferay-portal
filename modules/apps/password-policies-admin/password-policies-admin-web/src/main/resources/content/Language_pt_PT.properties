allow-dictionary-words=Permita Palavras Do Dicionário
allow-dictionary-words-help=If this is checked, common dictionary words are allowed in the user's passwords.
change-required=Mudança Requerida
change-required-help=If this is checked, a user is required to change their password when they first log in.
changeable=Changeable
changeable-help=If this is checked, the user can change their password.
do-not-warn=Do Not Warn
enable-expiration=Enable Expiration
enable-expiration-help=If this is checked, the user must change their password after a given amount of time.
enable-history=Enable History
enable-history-help=If this is checked, the portal keeps a history of the user's previous passwords and prevents them from reusing an old password.
enable-lockout=Enable Lockout
enable-lockout-help=If this is checked, a user can attempt to log in a certain number of times before their account is locked.
enable-syntax-checking=Enable Syntax Checking
enable-syntax-checking-help=If this is checked, the password is read for certain words and/or a certain length.
grace-limit=Limite Do Grace
grace-limit-help=This determines the number of times a user can log in after their password has expired, before they are required to enter a new password.
history-count=Contagem Do History
history-count-help=Isto determina o número de senhas precedentes manter-se no history.
javax.portlet.description.com_liferay_password_policies_admin_web_portlet_PasswordPoliciesAdminPortlet=Políticas de Palavra-chave definem medidas de segurança de nível empresarial, que podem ir do simples expirar da Palavra-chave à exclusão do Utilizador. Um Administrador poderá definir estas políticas no portal, ou simplesmente delega-las para um servidor LDAP.
javax.portlet.title.com_liferay_password_policies_admin_web_portlet_PasswordPoliciesAdminPortlet=Políticas de Palavra-chave
lockout-duration=Duração Do Fechamento
lockout-duration-help=Isto determina a quantidade de tempo que o cliente de um usuário é locked.
maximum-age=Idade Máxima
maximum-age-help=Isto determina quanto tempo uma senha é boa para antes que necessite ser mudada.
maximum-failure=Falha Máxima
maximum-failure-help=This determines the maximum number of times that a user can attempt to log in with the wrong password.
minimum-age=Idade Mínima
minimum-age-help=Isto determina quanto tempo um usuário deve esperar antes de mudar sua senha outra vez.
minimum-alpha-numeric=Minimum Alpha Numeric
minimum-alpha-numeric-help=This determines the minimum number of alpha numeric letters in the user's password.
minimum-length=Comprimento Mínimo
minimum-length-help=Isto determina o comprimento mínimo da senha do usuário.
minimum-lower-case=Minimum Lower Case
minimum-lower-case-help=This determines the minimum number of lower case letters in the user's password.
minimum-numbers=Minimum Numbers
minimum-numbers-help=Isto determina o comprimento mínimo da senha do usuário.
minimum-symbols=Minimum Symbols
minimum-symbols-help=Isto determina o comprimento mínimo da senha do usuário.
minimum-upper-case=Minimum Upper Case
minimum-upper-case-help=This determines the minimum number of upper case letters in the user's password.
password-expiration=Expiração Da Senha
password-history=History Da Senha
password-policies=Políticas Da Senha
password-syntax-checking=Verificar Da Sintaxe Da Senha
reset-failure-count=Restaure A Contagem Da Falha
reset-failure-count-help=Isto determina a quantidade de tempo que um registro de inícios de uma sessão falhados é mantido para o usuário.
reset-ticket-max-age=Reset Ticket Max Age
reset-ticket-max-age-help=This determines how long a password reset link is valid.
the-password-policy-could-not-be-found=The password policy could not be found.
until-unlocked-by-an-administrator=Até destravado por um administrador
warning-time=Tempo De advertência
warning-time-help=Isto determina quanto tempo antes que uma senha expire que o usuário estará notificado.
when-no-password-policy-is-assigned-to-a-user,-either-explicitly-or-through-an-organization,-the-default-password-policy-is-used=When no password policy is assigned to a user, either explicitly or through an organization, the default password policy is used.
you-are-using-ldaps-password-policy=Você está usando a política da senha de LDAP. Mude por favor seus ajustes da política da senha de LDAP se você desejar usar uma política local da senha.