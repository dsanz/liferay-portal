javax.portlet.description.com_liferay_password_policies_admin_web_portlet_PasswordPoliciesAdminPortlet=Zasady haseł określają środki bezpieczeństwa na poziomie przedsiębiorstwa, z uwzględnieniem blokowania użytkownika i wygasania haseł. Administratorzy mogą określać zasady lub wyznaczyć do tego odpowiedni serwer LDAP.
javax.portlet.title.com_liferay_password_policies_admin_web_portlet_PasswordPoliciesAdminPortlet=Zasady haseł
