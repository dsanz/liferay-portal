javax.portlet.description.com_liferay_staging_configuration_web_portlet_StagingConfigurationPortlet=Staging Configuration allows access to your site's configurable staging settings.
javax.portlet.title.com_liferay_staging_configuration_web_portlet_StagingConfigurationPortlet=Staging Configuration
live-group-remote-staging-alert=The current site currently acts as a live site for a remote staging environment. It can be still enabled as a staging environment to achieve multiple step staging although some of the staging options have been disabled.
local-live=Lokale productieomgeving
page-versioning=Paginaversiebeheer
page-versioning-help=Page versioning lets you work in parallel in different variations of the pages. It also lets you keep track of the history of changes in those pages.
remote-publish-help=Om wijzigingen te publiceren naar een <em>externe server (host/IP)</em>, moet u de publicatieserver toevoegen aan de lijst van vertrouwde servers. Neem het IP-adres van de publicerende server op in de eigenschap <code>tunnel.servlet.hosts.allowed</code> in het <code>portal-ext.properties</code> bestand van de doelserver. Een <em>extern contextpad</em> is alleen vereist als de doelserver een non-root portal servlet contextpad gebruikt. Toegang tot de <code>/tunnel-web</code> context op de doelserver mag niet zijn geblokkeerd door proxies of firewalls. Is de doelserver een cluster, neemt u dan het <em>IP-adres</em> van de loadbalancer op om hoge beschikbaarheid tijdens het publicatieproces veilig te stellen.
staged-content=Gefaseerde content
staged-portlets-alert=When a portlet is checked, its data is copied to staging and it may not be possible to edit them directly in live. When unchecking a portlet, make sure that any changes done in staging are published first, because otherwise they might be lost.
staged-portlets-help=Portlets that are checkmarked are <em>Staged</em>. This means that their data is published automatically whenever a page containing them is published. Those portlets which are disabled and checkmarked are always automatically exported, even if they are not on the page. Those which are disabled and not checkmarked are never automatically published. <em>Collaboration</em> portlets, such as <em>Blogs</em>, <em>Message Boards</em>, and <em>Wiki</em> are excluded from being <em>Staged</em> by default as their data typically originates in Live. Effectively, when a portlet is <em>NOT Staged</em> the <em>Live</em> environment contains the only important data. When <em>Local Live</em> staging is used, the same data is displayed whether viewing the portlet from either environment.
staging-cannot-be-used-for-this-site-because-the-propagation-of-changes-from-the-site-template-is-enabled=Het is niet mogelijk om voor deze site gefaseerde publicatie te gebruiken, omdat propagatie van wijzigingen van de sitesjabloon is ingeschakeld.
staging-type=Type pre-publicatiefase
staging-type-local=Er is een kloon van de huidige site aangemaakt die kopieën bevat van alle bestaande pagina's en van alle portletdata die zijn geconfigureerd voor fasering (zie <em>Gefaseerde portlets</em> hieronder). Deze kloon wordt de <em>Pre-publicatie</em>omgeving terwijl de oorspronkelijke site de <em>Productie</em>omgeving wordt.
staging-type-remote=Deze site is verbonden met een site op een externe server. Deze site wordt de <em>Pre- publicatie</em>omgeving en de externe site wordt de <em>Productie</em>omgeving.
the-publication-process-did-not-start-due-to-validation-errors=The publication process did not start due to validation errors.
the-status-of-the-publication-can-be-checked-on-the-publish-screen=De status van de publicatie is zichtbaar op het publicatiescherm.
you-do-not-have-permission-to-manage-settings-related-to-staging=U hebt geen rechten om de instellingen voor de gefaseerde pre-productiefase te beheren.
