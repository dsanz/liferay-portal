javax.portlet.description.com_liferay_staging_configuration_web_portlet_StagingConfigurationPortlet=Staging Configuration allows access to your site's configurable staging settings.
javax.portlet.title.com_liferay_staging_configuration_web_portlet_StagingConfigurationPortlet=Staging Configuration
live-group-remote-staging-alert=The current site currently acts as a live site for a remote staging environment. It can be still enabled as a staging environment to achieve multiple step staging although some of the staging options have been disabled.
local-live=Ambiente de produção local
page-versioning=Versionamento da página
page-versioning-help=Page versioning lets you work in parallel in different variations of the pages. It also lets you keep track of the history of changes in those pages.
remote-publish-help=Para publicar mudanças em um <em>Servidor Remoto</em>, o servidor de origem deve ser adicionado a lista de servidores permitidos. Isto é feito adicionando o IP do servidor de origem na propriedade <code>tunnel.servlet.hosts.allowed</code> no arquivo de configuração <code>portal-ext.properties</code> do servidor de destino. O acesso ao contexto <code>/tunnel-web</code> no servidor de destino não deve estar sendo bloqueado por nenhum proxy ou firewalls. Se o servidor de destino for um cluster, é possível especificar como servidor remoto o endereço do balanceador de carga para aumentar a alta disponibilidade do processo de publicação.
staged-content=Conteúdo Staged
staged-portlets-alert=When a portlet is checked, its data is copied to staging and it may not be possible to edit them directly in live. When unchecking a portlet, make sure that any changes done in staging are published first, because otherwise they might be lost.
staged-portlets-help=Portlets that are checkmarked are <em>Staged</em>. This means that their data is published automatically whenever a page containing them is published. Those portlets which are disabled and checkmarked are always automatically exported, even if they are not on the page. Those which are disabled and not checkmarked are never automatically published. <em>Collaboration</em> portlets, such as <em>Blogs</em>, <em>Message Boards</em>, and <em>Wiki</em> are excluded from being <em>Staged</em> by default as their data typically originates in Live. Effectively, when a portlet is <em>NOT Staged</em> the <em>Live</em> environment contains the only important data. When <em>Local Live</em> staging is used, the same data is displayed whether viewing the portlet from either environment.
staging-cannot-be-used-for-this-site-because-the-propagation-of-changes-from-the-site-template-is-enabled=Staging não pode ser usado para este site, porque a propagação de alterações do modelo de site está ativado.
staging-type=Tipo de staging
staging-type-local=Um clone do site atual é criado contendo cópias de todas as páginas e os dados existentes dos portlets configurados para staging (ver <em>Staged Portlets</em> abaixo). Este clone torna-se ambiente <em>Staging</em> enquanto o original se torna o ambiente <em>de produção</em>.
staging-type-remote=A conexão é feita entre este site e um já existente em um servidor remoto. Este site torna-se o ambiente <em>Staging</em> enquanto o site remoto torna-se o ambiente <em>de produção</em>.
the-publication-process-did-not-start-due-to-validation-errors=The publication process did not start due to validation errors.
the-status-of-the-publication-can-be-checked-on-the-publish-screen=O status da publicação pode ser verificado na tela de publicação.
you-do-not-have-permission-to-manage-settings-related-to-staging=Você não tem permissão para gerenciar as configurações relacionadas a staging.
