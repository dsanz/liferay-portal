allow-lan-syncing=Permitir sincronización a través de LAN?
allow-lan-syncing-help=Estableza isto a verdadeiro para sincronizar a través de LAN os clientes de escritorio. Se isto é habilitado, os clientes de escritorio tentarán descargar actualizacións doutros clientes de escritorio dentro da mesma rede local antes de as descargar do servidor.
