allow-lan-syncing=Permitir sincronização LAN?
allow-lan-syncing-help=Colocar esta opção a verdade para habilitar sincronização LAN para os clientes desktop. Quando habilitado, os clientes desktop vão tentar descarregar atualizações de outros clientes desktop na mesma rede local, antes de as descarregar do servidor.
allow-the-use-of-sync=Permitir o uso de Sincronização?
allow-users-to-sync-their-personal-sites=Permitir que os utilizadores sincronizem os seus sites pessoais?
build=Construir
default-file-permissions=Permissões de Ficheiro por Omissão
delete-sync-device=Remover Dispositivo Sync
disable-sync-device=Desabilitar Dispositivo Sync
disable-sync-site=Desativar Sync para o Site
disable-sync-sites=Desativar Sync para os Sites
disabling-a-sync-site-will-delete-all-associated-files-from-all-clients=Desativar o Sync de um site irá apagar todos os ficheiros associados, em todos os clientes.
enable-sync-device=Ativar Dispositivo Sync
enable-sync-site=Ativar Sync para o Site
enable-sync-sites=Ativar Sync para os Sites
force-security-mode=Forçar Modo de Segurança
force-security-mode-help=Colocar esta opção a verdade para forçar o modo de segurança em clientes móveis. O modo de segurança cifra ficheiros e requer uma senha quando acede à aplicação.
full-access=Acesso Total
full-access-help=Os membros do site serão capazes de ver, atualizar, apagar e comentar nos ficheiros carregados através do Liferay Sync.
full-access-x=Acesso Total ({0})
javax.portlet.title.com_liferay_sync_web_portlet_SyncAdminPortlet=Administração do Conector Sync
javax.portlet.title.com_liferay_sync_web_portlet_SyncDevicesPortlet=Os Meus Dispositivos Sync
last-seen=Última Vez Visto
max-connections=Número máximo de conexões
max-connections-help=Define o número máximo de conexões simultâneas permitidas para cada cliente, por conta.
max-download-rate=Máxima Taxa de Download
max-download-rate-help=Define a taxa máxima para transferência, em bytes, à qual os clientes podem efetuar downloads. Um valor de 0 indica que não há nenhum limite.
max-upload-rate=Taxa Máxima de Upload
max-upload-rate-help=Define a taxa máxima de transferência, em bytes, à qual os clientes podem fazer upload. O valor 0 indica que não há nenhum limite.
no-devices-were-found=Nenhum dispositivo foi encontrado.
oauth-enabled=OAuth Ativo
oauth-enabled-help=Se selecionado, os clientes utilizarão OAuth e filtros SSO de autologin configurados para autenticação.
oauth-publisher-is-not-deployed=OAuth Publisher não está instalado. Por favor, reinstalar o plugin.
pending-wipe=Limpeza Pendente
poll-interval=Intervalo de Sondagem
poll-interval-help=Define o intervalo (em segundos) para a frequência com que os clientes consultarão o servidor para atualizações.
the-oauth-application-for-liferay-sync-is-missing=A aplicação OAuth para Liferay Sync não está presente. Clique em Salvar para recriar a aplicação OAuth.
view-and-add-discussion=Ver e Adicionar Discussão
view-and-add-discussion-help=Os membros do site serão capazes de ver e comentar os ficheiros carregados através do Liferay Sync.
view-only=Apenas Consulta
view-only-help=Os membros do site apenas serão capazes de consultar os ficheiros carregados através do Liferay Sync.
view-update-and-add-discussion=Visualizar, Atualizar e Adicionar uma Discussão
view-update-and-add-discussion-help=Os membros do site serão capazes de visualizar, atualizar e comentar sobre os ficheiros carregados através do Liferay Sync.
wipe-sync-device=Eliminar Dispositivo Sync
wiped=Eliminado
wiping-a-sync-device-will-delete-all-associated-files-from-the-client=Eliminar um dispositivo Sync irá remover todos os ficheiros associados do cliente.