allow-lan-syncing=Permitir Sincronização pela LAN?
allow-lan-syncing-help=Defina como verdadeiro para habilitar sincronização LAN através de clientes desktop. Quando ativado, os clientes desktop tentarão baixar atualizações de outros clientes desktop na mesma rede local antes de fazer o download a partir do servidor.
allow-the-use-of-sync=Permitir o uso de Sincronização?
allow-users-to-sync-their-personal-sites=Permitir que os usuários sincronizem seus sites pessoais?
build=Construir
default-file-permissions=Permissões de Arquivo Padrão
delete-sync-device=Excluir dispositivo Sync
disable-sync-device=Desabilitar Dispositivo de Sincronização
disable-sync-site=Desabilitar Sync para o Site
disable-sync-sites=Desabilitar Sync para os Sites
disabling-a-sync-site-will-delete-all-associated-files-from-all-clients=Desabilitar o Sync de um site apagará todos os arquivos associados em todos os clientes.
enable-sync-device=Habilitar Dispositivo de Sincronização
enable-sync-site=Habilitar Site Sync
enable-sync-sites=Habilitar Sync para os Sites
force-security-mode=Forçar Modo de Segurança
force-security-mode-help=Defina isso como TRUE para forçar o modo de segurança em clientes móveis. O modo de segurança criptografa arquivos e requer um código de acesso ao acessar o aplicativo.
full-access=Acesso Total
full-access-help=Os membros do site serão capazes de ver, atualizar, apagar e comentar nos arquivos enviados através Liferay Sync.
full-access-x=Acesso Total ({0})
javax.portlet.title.com_liferay_sync_web_portlet_SyncAdminPortlet=Administração do Conector Sync
javax.portlet.title.com_liferay_sync_web_portlet_SyncDevicesPortlet=Meus Dispositivos Sync
last-seen=Visto por última vez
max-connections=Número máximo de conexões
max-connections-help=Define o número máximo de conexões simultâneas permitidas para cada cliente por conta.
max-download-rate=Taxa de Download Máxima
max-download-rate-help=Definir a taxa de transferência máxima, em bytes, em que os clientes podem baixar. Um valor de 0 indica que não há nenhum limite.
max-upload-rate=Taxa Máxima de Upload
max-upload-rate-help=Define a taxa máxima de transferência, em bytes, na qual os clientes podem fazer upload. O valor 0 indica que não há limite.
no-devices-were-found=Nenhum dispositivo foi encontrado.
oauth-enabled=OAuth Habilitado
oauth-enabled-help=Se marcada, os clientes usarão OAuth e filtros SSO de autologin configurados para autenticação.
oauth-publisher-is-not-deployed=OAuth Publisher não está instalado. Por favor, reinstalar o plugin.
pending-wipe=Wipe Pendente
poll-interval=Intervalo de Sondagem
poll-interval-help=Define o intervalo (em segundos) para a frequência com que os clientes consultarão o servidor de atualizações.
the-oauth-application-for-liferay-sync-is-missing=A aplicação OAuth para Liferay Sync não está presente. Clique em Salvar para recriar a aplicação OAuth.
view-and-add-discussion=Ver e Adicionar Discussão
view-and-add-discussion-help=Os membros do site serão capazes de ver e comentar os arquivos enviados através Liferay Sync.
view-only=Apenas Visualizar
view-only-help=Os membros do site serão capazes de ver apenas os arquivos enviados através Liferay Sync.
view-update-and-add-discussion=Visualizar, Atualizar e Adicionar uma Discussão
view-update-and-add-discussion-help=Os membros do site serão capazes de visualizar, atualizar e comentar sobre os arquivos enviados através Liferay Sync.
wipe-sync-device=Eliminar Dispositivo Sync
wiped=Eliminado
wiping-a-sync-device-will-delete-all-associated-files-from-the-client=Eliminar um dispositivo Sync irá excluir todos os arquivos associados do cliente.