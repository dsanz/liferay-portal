cas-login-url-help=Ρυθμίσετε το διακομιστή CAS σύνδεσης URL. Οι χρήστες ανακατευθύνονται στη σελίδα σύνδεσης CAS κατά τον έλεγχο ταυτότητας με την πύλη. (Automatic Translation)
cas-logout-on-session-expiration=Αποσύνδεση κατά τη λήξη της περιόδου λειτουργίας. (Automatic Translation)
cas-logout-on-session-expiration-help=Αν είναι επιλεγμένο, προγράμματα περιήγησης με ληγμένων περιόδων λειτουργίας θα μεταφερθείτε στο CAS logout URL. (Automatic Translation)
cas-logout-url-help=Ρυθμίσετε το διακομιστή CAS logout URL. Ορίστε αυτό αν θέλετε η πύλη αποσύνδεση λειτουργία για να προκαλέσει μια αποσύνδεση από CAS. (Automatic Translation)
cas-no-such-user-redirect-url-help=Σύνολο που το URL να ανακατευθύνει ένα χρήστη, εάν ο χρήστης να πραγματοποιήσει έλεγχο ταυτότητας με το CAS, αλλά δεν μπορεί να βρεθεί στην πύλη. Εάν είναι ενεργοποιημένη η εισαγωγή από LDAP, ο χρήστης θα επανακατευθυνθεί αν αυτός δεν μπορεί να βρεθεί ή δεν μπόρεσαν να εισαχθούν από LDAP. (Automatic Translation)
cas-server-name-help=Θέστε αυτό για να ενεργοποιήσετε την βαθιά σύνδεση με την πύλη (π.χ. Οι http://localhost:8080). (Automatic Translation)
cas-server-url-help=Ρυθμίσετε το διακομιστή CAS πρόθεμα URL τομέα (π.χ. https://localhost:8443/cas-web). (Automatic Translation)
cas-service-url-help=Θέστε αυτό για να απενεργοποιήσετε την βαθιά σύνδεση με την πύλη (π.χ. http://localhost:8080/c/πύλη/login). (Automatic Translation)
cas.configuration.name=CAS Server (Automatic Translation)
import-cas-users-from-ldap=Εισαγωγή από LDAP (Automatic Translation)
import-cas-users-from-ldap-help=Εάν είναι επιλεγμένο, οι χρήστες που επικυρώνονται από CAS που δεν υπάρχουν στην πύλη εισάγονται από LDAP. Πρέπει να ενεργοποιηθούν LDAP. (Automatic Translation)
no-such-user-redirect-url=Καμία τέτοια διεύθυνση URL ανακατεύθυνσης χρήστη (Automatic Translation)
