cas-login-url-help=Установка сервера клиентского доступа URL-адрес входа. Пользователи перенаправляются на страницу входа CAS при проверке подлинности в портал. (Automatic Translation)
cas-logout-on-session-expiration=Выход из системы по окончании сессии. (Automatic Translation)
cas-logout-on-session-expiration-help=Если этот флажок установлен, браузеры с просроченных сеансов перенаправляется на URL-адрес выхода из системы CAS. (Automatic Translation)
cas-logout-url-help=Установка сервера клиентского доступа URL-адрес выхода из системы. Установите это, если вы хотите, чтобы функция logout портала для активации выхода CAS. (Automatic Translation)
cas-no-such-user-redirect-url-help=Задайте URL-адрес, чтобы перенаправить пользователя, если пользователь может выполнять проверку подлинности с клиентского доступа, но не может быть найден на портале. Если импорт из LDAP включена, пользователь перенаправляется, если он не может быть найден или не может быть импортирован из LDAP. (Automatic Translation)
cas-server-name-help=Установите это для глубоких ссылок в портал (например-http://localhost:8080). (Automatic Translation)
cas-server-url-help=Установка сервера клиентского доступа домена префикс URL-адреса (например, https://localhost:8443/cas-web). (Automatic Translation)
cas-service-url-help=Установите это для отключения глубоких ссылок в портал (например http://localhost:8080/c/портал/логин). (Automatic Translation)
cas.configuration.name=Сервер клиентского доступа (Automatic Translation)
import-cas-users-from-ldap=Импорт из LDAP (Automatic Translation)
import-cas-users-from-ldap-help=Если этот флажок установлен, пользователи проверки подлинности из клиентского доступа, которые не существуют в портале импортируются из LDAP. LDAP должен быть включен. (Automatic Translation)
