cas-login-url-help=تعيين الملقم CAS محدد موقع معلومات تسجيل الدخول. يتم إعادة توجيه المستخدمين إلى صفحة تسجيل الدخول في سجل المستخلصات الكيميائية عند مصادقة في المدخل. (Automatic Translation)
cas-logout-on-session-expiration=تسجيل الخروج على انتهاء الدورة. (Automatic Translation)
cas-logout-on-session-expiration-help=إذا كان هذا هو التحقق، ستتم إعادة توجيه المستعرضات مع دورات منتهية الصلاحية إلى URL خروج CAS. (Automatic Translation)
cas-logout-url-help=تعيين الملقم CAS محدد موقع معلومات تسجيل الخروج. قم بتعيين هذا إذا كنت تريد الدالة خروج البوابة يؤدي خروج CAS. (Automatic Translation)
cas-no-such-user-redirect-url-help=تعيين عنوان URL لإعادة توجيه مستخدم إلى، إذا كان المستخدم يمكن المصادقة مع الأكاديمية الصينية للعلوم ولكن لا يمكن العثور على في المدخل. إذا تم تمكين الاستيراد من LDAP، يتم إعادة توجيه المستخدم إذا كان لا يمكن العثور عليه أو لا يمكن استيراد من LDAP. (Automatic Translation)
cas-server-name-help=قم بتعيين هذا تمكين الربط العميق في المدخل (مثلاً ب http://localhost:8080). (Automatic Translation)
cas-server-url-help=تعيين الملقم CAS المجال بادئة URL (مثل https://localhost:8443/cas-ويب). (Automatic Translation)
cas-service-url-help=قم بتعيين هذا تعطيل ربط عميق في المدخل (مثلاً http://localhost:8080/c/بوابة/تسجيل الدخول). (Automatic Translation)
cas.configuration.name=ملقم CAS (Automatic Translation)
import-cas-users-from-ldap=استيراد من LDAP (Automatic Translation)
import-cas-users-from-ldap-help=إذا كان هذا هو التحقق، يتم استيراد المستخدمين مصادقة من المراجع المصدقة التي لم تكن موجودة في المدخل من LDAP. يجب أن يتم تمكين LDAP. (Automatic Translation)
no-such-user-redirect-url=لا يوجد المستخدم إعادة توجيه عنوان URL (Automatic Translation)
