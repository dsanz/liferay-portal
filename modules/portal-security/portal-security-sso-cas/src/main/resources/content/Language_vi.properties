cas-logout-on-session-expiration-help=Nếu điều này được chọn, các trình duyệt với hết hạn phiên sẽ được chuyển hướng đến URL đăng xuất CAS. (Automatic Translation)
cas-logout-url-help=Đặt các máy chủ CAS logout URL. Thiết lập này nếu bạn muốn đăng xuất của cổng thông tin chức năng để kích hoạt một logout CAS. (Automatic Translation)
cas-no-such-user-redirect-url-help=Đặt URL chuyển hướng người dùng, nếu người dùng có thể xác thực với CAS nhưng không thể được tìm thấy trong cổng. Nếu nhập khẩu từ LDAP được kích hoạt, người dùng được chuyển hướng nếu ông không thể được tìm thấy hoặc không có thể được nhập khẩu từ LDAP. (Automatic Translation)
cas-server-name-help=Thiết lập này để cho phép liên kết sâu vào cổng thông tin (ví dụ như http://localhost:8080). (Automatic Translation)
cas-server-url-help=Thiết lập máy chủ CAS miền URL tiền tố (ví dụ: https://localhost:8443/cas-web). (Automatic Translation)
cas-service-url-help=Thiết lập này để vô hiệu hoá liên kết sâu vào cổng thông tin (ví dụ: http://localhost:8080/c/cổng/đăng nhập). (Automatic Translation)
cas.configuration.name=Máy chủ CAS (Automatic Translation)
