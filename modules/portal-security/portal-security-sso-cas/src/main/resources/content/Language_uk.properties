cas-logout-url-help=Встановити сервер клієнтського доступу вихід URL. Встановити це, якщо потрібно, щоб функція вихід порталу запускатиме CAS вихід. (Automatic Translation)
cas-no-such-user-redirect-url-help=Встановити URL перенаправлення користувача, якщо користувач може автентифікувати з клієнтського доступу, але не можуть бути знайдені на порталі. Ввімкненої імпорту із LDAP, користувач переспрямовується, якщо він не знайдено або не вдалося імпортувати безпосередньо із протоколу LDAP. (Automatic Translation)
cas-server-name-help=Встановити це для ввімкнення глибокі посилання на портал (наприклад. http://localhost:8080). (Automatic Translation)
cas-server-url-help=Встановити сервер клієнтського доступу домен URL префікс (наприклад https://localhost:8443/cas-web). (Automatic Translation)
cas-service-url-help=Встановити це відключити глибокі посилання на портал (наприклад http://localhost:8080/c/портал/увійти). (Automatic Translation)
cas.configuration.name=Сервер клієнтського доступу (Automatic Translation)
import-cas-users-from-ldap=Імпорт із протоколу LDAP (Automatic Translation)
import-cas-users-from-ldap-help=Якщо позначено цей пункт, користувачів автентифіковано від CAS, які не існують на порталі імпортується з LDAP. Потрібно увімкнути LDAP. (Automatic Translation)
