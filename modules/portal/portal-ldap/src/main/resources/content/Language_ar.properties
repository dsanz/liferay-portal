group-search-filter-enabled-help=إذا كان سيتم تطبيق مجموعة إلى true، عامل تصفية مجموعة، ولكن فقط للمجموعات في DN الأساسي المحدد. إذا كان تعيين إلى false، عامل التصفية لن تطبق وجميع الفئات التي ترتبط مع المستخدمين المستوردة سيتم استيرادها بغض النظر عن DN قاعدة. (Automatic Translation)
group-search-filter-help=الإعدادات لاستيراد مجموعات من LDAP إلى المدخل. لا يتم استخدام هذه الإعدادات إلا إذا تم تعيين الخاصية "LDAPImportConfiguration.enabled" true. (Automatic Translation)
