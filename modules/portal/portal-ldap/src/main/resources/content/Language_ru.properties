the-ldap-url-format-is=The LDAP Base Provider URL format is <em>ldap://host:port</em>. The Base DN specifies the initial search context for users and is optional. For example, use <em>ldap://localhost:389</em> and <em>ou=Users,o=Example</em> for your values. (Automatic Copy)
use-ldap-password-policy=Использование LDAP политики паролей (Automatic Translation)
user-custom-mappings-help=При импорте и экспорте пользователей, портал будет использовать это сопоставление для подключения LDAP атрибуты пользователей и пользовательских атрибутов пользователя портала. (Automatic Translation)
