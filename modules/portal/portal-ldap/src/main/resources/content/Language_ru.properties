default-ldap-server-settings-are-in-use-please-add-an-ldap-server-to-override-the-default-settings=Параметры сервера LDAP по умолчанию находятся в эксплуатации. Пожалуйста, добавьте сервер LDAP для переопределения параметров по умолчанию. (Automatic Translation)
