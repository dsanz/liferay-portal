default-ldap-server-settings-are-in-use-please-add-an-ldap-server-to-override-the-default-settings=LDAP сървър настройките по подразбиране се използват. Моля, добавете LDAP сървър за да потиснете настройките по подразбиране. (Automatic Translation)
