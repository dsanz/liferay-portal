default-ldap-server-settings-are-in-use-please-add-an-ldap-server-to-override-the-default-settings=За замовчуванням сервер LDAP, використовуються. Будь ласка, додайте LDAP-сервер, щоб проігнорувати настройки за промовчанням. (Automatic Translation)
