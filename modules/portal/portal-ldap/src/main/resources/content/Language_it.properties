please-map-each-of-the-group-properties-group-name-and-user-to-an-ldap-attribute=Please map each of the group properties <em>Group Name</em> and <em>User</em> to an LDAP attribute. (Automatic Copy)
range-size-help=Impostare il numero di valori da restituire in ogni query a un attributo multivalore per i server di directory che supporta il recupero della fascia. Le dimensioni dell'intervallo devono essere 1000 o meno per Windows 2000 e il 1500 o meno per Windows Server 2003. (Automatic Translation)
