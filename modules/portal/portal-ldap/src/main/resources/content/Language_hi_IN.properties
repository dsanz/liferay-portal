import-enabled-user-password-autogenerated-help=यदि यह चेक किया गया है, क्रेडेंशिल पासवर्ड आयात किए गए उपयोगकर्ताओं के लिए उपयोग किया जाता है। इन उपयोगकर्ताओं को निर्यात करना उनके मूल पासवर्ड में LDAP ओवरराइट किया जा रहा करने के लिए नेतृत्व करेंगे। (Automatic Translation)
