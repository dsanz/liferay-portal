liferay-has-failed-to-connect-to-the-ldap-server=Liferay đã thất bại khi kết nối đến máy chủ LDAP. Xin vui lòng kiểm tra cấu hình của bạn và xác minh rằng máy chủ LDAP đang chạy. (Automatic Translation)
liferay-has-successfully-connected-to-the-ldap-server=Liferay đã thành công kết nối đến máy chủ LDAP. (Automatic Translation)
method-help=Thiết lập hoặc ràng buộc hoặc mật khẩu-so sánh cho các phương pháp xác thực LDAP. Ràng buộc được ưa thích bởi hầu hết các nhà cung cấp, do đó bạn không cần phải lo lắng về chiến lược mã hóa. (Automatic Translation)
other-directory-server=Máy chủ thư mục khác (Automatic Translation)
page-size-help=Thiết lập kích thước trang cho máy chủ thư mục đó phân trang hỗ trợ. Giá trị này cần phải được 1000 hoặc ít hơn cho hệ phục vụ thư mục hoạt động Microsoft. (Automatic Translation)
password-encryption-algorithm-help=Đặt mã hoá mật khẩu sử dụng để so sánh mật khẩu trong khi chuyển nhập và sử dụng cho mã hóa mật khẩu trong quá trình xuất khẩu. So sánh mật khẩu trong khi chuyển nhập chỉ sẽ được sử dụng khi tài sản "LDAPAuthConfiguration.method" được thiết lập để so sánh mật khẩu. Nếu mã hóa được thiết lập để không, mà là giá trị mặc định, mật khẩu được coi là đồng bằng văn bản. Thuật toán SHA-512 là hiện nay không được hỗ trợ. (Automatic Translation)
password-policy-enabled-help=Thiết lập này để đúng với chính sách mật khẩu sử dụng LDAP thay vì chính sách cổng thông tin mật khẩu. Nếu thiết lập để đúng, nó có thể là cổng thông tin mật khẩu được tạo ra sẽ không phù hợp với chính sách LDAP. Xem các thuộc tính "passwords.regexptoolkit.*" để biết chi tiết về cấu hình RegExpToolkit trong việc tạo các mật khẩu. (Automatic Translation)
please-enter-a-unique-ldap-server-name=Vui lòng nhập tên máy chủ LDAP duy nhất. (Automatic Translation)
please-enter-a-valid-ldap-search-filter=Vui lòng nhập một bộ lọc tìm kiếm LDAP hợp lệ. (Automatic Translation)
please-enter-a-valid-ldap-server-name=Vui lòng nhập một tên hệ phục vụ LDAP hợp lệ. (Automatic Translation)
please-map-each-of-the-group-properties-group-name-and-user-to-an-ldap-attribute=Please map each of the group properties <em>Group Name</em> and <em>User</em> to an LDAP attribute. (Automatic Copy)
range-size-help=Đặt số lượng các giá trị để trở lại trong mỗi truy vấn cho một thuộc tính đặc cho máy chủ thư mục hỗ trợ phạm vi tra cứu. Phạm vi kích thước phải là 1000 hoặc ít hơn cho Windows năm 2000 và 1500 hoặc ít hơn cho Windows Server 2003. (Automatic Translation)
