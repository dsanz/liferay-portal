javax.portlet.description.125=Els usuaris són persones que realitzen tasques utilitzant el portal. Els administradors poden crear usuaris nous o desactivar-ne d'existents. Els usuaris poden unir-se a llocs web, associar-se a jerarquies d'organitzacions, rebre permisos de rols o agrupar-se. Els grups d'usuari poden creuar els límits entre organitzacions i ser emprats per assignar tots els membres a altres col·leccions, com llocs web o rols. També poden utilitzar-se els grups d'usuari per personalitzar plantilles de pàgina per a membres.
javax.portlet.description.127=Els grups d'usuari proporcionen una manera d'agrupar els usuaris independentment de les organitzacions a les quals pertanyen. Els administradors poden definir un grup d'usuaris i assignar-lo com a membre d'un lloc per tal que tots els seus usuaris esdevinguin membres automàticament.
javax.portlet.description.128=Els rols són agrupacions d'usuaris que comparteixen una acció concreta segons un àmbit determinat. Els administradors poden crear rols que atorguin permisos per realitzar diverses accions dins de les aplicacions d'un mòdul de portal.
javax.portlet.description.129=Les polítiques de contrasenyes defineixen les mesures de seguretat empresarial que inclouen el bloqueig d'usuaris i la caducitat de la contrasenya. Els administradors poden definir les polítiques o delegar-les a un servidor LDAP.
