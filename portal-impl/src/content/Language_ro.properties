javax.portlet.description.125=Utilizatorii sunt persoane care efectuează acțiuni folosind portalul. Administratorii pot crea utilizatori sau pot deactiva utilizatorii curenți. Utilizatorii pot deveni membri ai siturilor, pot sa fie plasați în ierarhia unei organizații, pot să le fie acordate permisiuni în cadrul unor roluri, sau să facă parte dintr-un grup de utilizatori. Grupurile de utilizatori pot conține membri din mai multe organizații, și pot fi folosite pentru a asocia membrii lor cu alte colecții, de exemplu situri sau roluri. Grupurile de utilizatori pot fi folosite și pentru a personaliza șablonurile siturile personale ale membrilor lor.
javax.portlet.description.127=Grupurile de utilizatori permit gruparea utilizatorilor independent de organizațiile cărora le aparțin. Administratorii pot defini un grup de utilizatori și pot desemna grupul ca membru al unui site pentru a face toți utilizatorii din grup membrii ai acestui site.
javax.portlet.description.128=Rolurile sunt grupări de utilizatori care au o anumită funcție în cadrul portalului, corespunzătoare unui scop anume. Administratorii pot adăuga roluri cărora le pot fi acordate permisiuni la funcții diferite în cadrul aplicațiilor modulelor.
javax.portlet.description.129=Politica setării de parole definește securitatea la nivel de întreprindere care include deconectarea utilizatorului și expirarea parolei. Administratorii pot defini politicile ori le pot delega la un server LDAP (Lightweight Directory Access Protocol).
