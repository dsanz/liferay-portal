javax.portlet.description.125=Korisnici su pojedinci koji izvode zadatke koristeći portal. Administratori mogu kreirati nove korisnike ili deaktivirati postojeće. Korisnici se mogu pridružiti web sjedištima, biti smješteni u hijerarhiju organizacija, može im se dodijeliti dozvole kroz uloge ili mogu biti grupirani u korisničke grupe. Korisničke grupe mogu biti dijeljene kroz organizacije i korištene za pridruživanje svih članova drugim web sjedištima ili ulogama. Također, korisničke grupe se mogu koristiti za uređivanje personaliziranih predložaka web sjedišta za članove.
javax.portlet.description.127=Korisničke grupe omogućavaju grupiranje korisnika neovisno o organizacijama kojima pripadaju. Administratori mogu definirati korisničku grupu i pridjeliti je web sjedištu čime svi njeni korisnici automatski postaju članovi toga web sjedišta.
javax.portlet.description.128=Uloge podrazumijevaju funkcijsko grupiranje korisnika u portalu, ovisno o zadanom djelokrugu. Administratori mogu dodijeliti uloge koje imaju dopuštenje za različite funkcije unutar portlet aplikacija portala.
javax.portlet.description.129=Pravila za lozinke definiraju sigurnosne mjere na razini poduzeća koje uključuju zaključavanje korisnika i istek lozinke. Administratori mogu definirati pravila ili to prepustiti LDAP poslužitelju.
