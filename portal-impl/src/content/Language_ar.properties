javax.portlet.description.125=المستخدم هو شخص يقوم بمهام مستخدما البوابة. يمكن للمسؤول أن ينشئ مستخدمين جدد أو أن يعطل مستخدمين حاليين. يمكن للمستخدم أن ينضم إلى مواقع، أو أن ينتمي إلى هيكلة مؤسسات، أو أن يتم تفويض صلاحيات في الأدوار له، أو أن يوضع في مجموعة مستخدمين. مجموعة المستخدمين يمكنها أن تتعدى حدود هيكلة المؤسسة، ويمكن استخدامها لتعيين كافة المستخدمين لمجموعات أخرى، كمواقع أو أدوار. ويمكن استخدام مجموعات المستخدمين لتعديل قوالب المواقع الشخصية للأعضاء.
javax.portlet.description.127=مجموعات المستخدمين توفر قناة لمستخدمي المجموعة بغض النظر عن المؤسسة التي ينتمون إليها. يمكن للمسؤولين أن يعرفوا مجموعة مستخدمين وتعيين المجموعة كعضو في موقع لجعل كافة المستخدمين في تلك المجموعة أعضاء تلقائيا.
javax.portlet.description.128=الأدوار هي مجموعات من المستخدمين الذين يشتركون في وظيفة معينة داخل موقع البورتال، وفقا لنطاق معين. يمكن للمسؤولين إضافة الأدوار التي يمكن منح الأذونات إلى وظائف مختلفة ضمن تطبيقات البورتال.
javax.portlet.description.129=نهج كلمة السر تعرف التدابير اللازمة الأمنية على مستوى المشاريع والتي تشمل تأمين المستخدم وانتهاء صلاحية كلمة المرور. يمكن للمسؤولين تحديد السياسات أو تفويضها إلى ملقم LDAP.
